:root{--bg:#f6f7f9;--panel:#fff;--text:#1d2330;--muted:#5d6678;--line:#d9dde5;--accent:#0b6bcb;--hit:#ffe58a;--code:#f0f2f6}
@media (prefers-color-scheme:dark){:root{--bg:#12151c;--panel:#1a1f2a;--text:#e4e8f0;--muted:#99a3b6;--line:#2b3342;--accent:#6cb0ff;--hit:#6b5a10;--code:#141821}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font:15px/1.5 system-ui,-apple-system,Segoe UI,sans-serif}
header{padding:16px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
h1{margin:0 0 10px;font-size:20px}
.controls{display:flex;flex-wrap:wrap;gap:8px}
select,input{font:inherit;color:var(--text);background:var(--bg);border:1px solid var(--line);border-radius:6px;padding:7px 10px}
input{flex:1;min-width:200px}
main{padding:16px;max-width:1200px;margin:0 auto}
h2{font-size:16px;margin:22px 0 8px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:auto}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{padding:6px 10px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}
th{color:var(--muted);font-weight:600;position:sticky;top:0;background:var(--panel)}
td.k{font-family:ui-monospace,Consolas,monospace}
tr:last-child td{border-bottom:0}
.file{margin-bottom:16px}
.file h3{margin:0;padding:8px 12px;font-size:14px;border-bottom:1px solid var(--line);display:flex;gap:10px;justify-content:space-between;flex-wrap:wrap}
.file h3 span{color:var(--muted);font-weight:400}
pre{margin:0;padding:10px 0;overflow:auto;background:var(--code);font:12.5px/1.45 ui-monospace,Consolas,monospace}
.ln{display:block;padding:0 12px;white-space:pre}
.ln i{font-style:normal;color:var(--muted);display:inline-block;width:3.2em;user-select:none}
mark{background:var(--hit);color:inherit;border-radius:2px}
.hitline{background:color-mix(in srgb,var(--hit) 35%,transparent)}
.note{color:var(--muted);font-size:13px}
button{font:inherit;color:var(--accent);background:none;border:1px solid var(--line);border-radius:6px;padding:3px 9px;cursor:pointer}
</style>

const DATA = {"entries": [{"id": "Linux_x64/syscalls.asm", "kind": "syscall", "dir": "Syscalls", "folder": "Linux_x64", "os": "Linux", "arch": "x86-64", "file": "syscalls.asm", "code": "; Linux x86-64 raw system calls (no libc).  Build: make   Run: ./syscalls\n; Convention: syscall number in RAX, args in RDI, RSI, RDX, R10, R8, R9.\n;             Execute \"syscall\". Result in RAX (-4095..-1 means -errno).\n;             RCX and R11 are destroyed by the instruction.\n; Numbers: read=0 write=1 open=2 close=3 mmap=9 munmap=11 getpid=39 exit=60\ndefault rel\n\nSYS_read   equ 0\nSYS_write  equ 1\nSYS_open   equ 2\nSYS_close  equ 3\nSYS_mmap   equ 9\nSYS_munmap equ 11\nSYS_getpid equ 39\nSYS_exit   equ 60\n\nsegment .data\nmsg:     db \"1. write: Hello from a raw Linux x64 syscall\", 10\nmsg_len  equ $ - msg\npidmsg:  db \"2. getpid: \"\npidmsg_len equ $ - pidmsg\nfilemsg: db \"3. open/read/close /etc/hosts (first 40 bytes):\", 10\nfilemsg_len equ $ - filemsg\nmapmsg:  db \"4. mmap: wrote this text into an anonymous page\", 10\nmapmsg_len equ $ - mapmsg\npath:    db \"/etc/hosts\", 0\nnl:      db 10\n\nsegment .bss\nnumbuf:  resb 24\nrdbuf:   resb 40\n\nsegment .text\nglobal _start\n\n; write(1, rsi, rdx)\ndo_write:\n        mov     edi, 1\n        mov     eax, SYS_write\n        syscall\n        ret\n\n; print RDI as decimal + newline\nprint_dec:\n        lea     rsi, [numbuf + 20]\n        mov     byte [rsi], 10\n        mov     rax, rdi\n        mov     ecx, 10\n.next:  xor     edx, edx\n        div     rcx\n        add     dl, '0'\n        dec     rsi\n        mov     [rsi], dl\n        test    rax, rax\n        jnz     .next\n        lea     rdx, [numbuf + 21]\n        sub     rdx, rsi\n        jmp     do_write\n\n_start:\n        ; 1. write(1, msg, len)\n        lea     rsi, [msg]\n        mov     edx, msg_len\n        call    do_write\n\n        ; 2. getpid()\n        lea     rsi, [pidmsg]\n        mov     edx, pidmsg_len\n        call    do_write\n        mov     eax, SYS_getpid\n        syscall\n        mov     rdi, rax\n        call    print_dec\n\n        ; 3. open / read / write / close\n        lea     rsi, [filemsg]\n        mov     edx, filemsg_len\n        call    do_write\n        mov     eax, SYS_open\n        lea     rdi, [path]\n        xor     esi, esi                ; O_RDONLY\n        xor     edx, edx\n        syscall\n        test    rax, rax\n        js      .fail\n        mov     r12, rax                ; fd\n        mov     eax, SYS_read\n        mov     rdi, r12\n        lea     rsi, [rdbuf]\n        mov     edx, 40\n        syscall\n        test    rax, rax\n        js      .fail\n        mov     rdx, rax                ; bytes read\n        lea     rsi, [rdbuf]\n        call    do_write\n        lea     rsi, [nl]\n        mov     edx, 1\n        call    do_write\n        mov     eax, SYS_close\n        mov     rdi, r12\n        syscall\n\n        ; 4. mmap(NULL, 4096, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0)\n        mov     eax, SYS_mmap\n        xor     edi, edi\n        mov     esi, 4096\n        mov     edx, 3                  ; PROT_READ|PROT_WRITE\n        mov     r10d, 0x22              ; MAP_PRIVATE|MAP_ANONYMOUS\n        mov     r8, -1\n        xor     r9d, r9d\n        syscall\n        cmp     rax, -4095\n        ja      .fail                   ; returned -errno\n        mov     r13, rax                ; page address\n        lea     rsi, [mapmsg]           ; copy text into the new page\n        mov     rdi, r13\n        mov     ecx, mapmsg_len\n        cld\n        rep movsb\n        mov     rsi, r13\n        mov     edx, mapmsg_len\n        call    do_write\n        mov     eax, SYS_munmap\n        mov     rdi, r13\n        mov     esi, 4096\n        syscall\n\n        ; 5. exit(0)\n        xor     edi, edi\n        mov     eax, SYS_exit\n        syscall\n.fail:\n        mov     edi, 1\n        mov     eax, SYS_exit\n        syscall\n"}, {"id": "Libc/Linux_x64/libc_calls.asm", "kind": "libc", "dir": "Libc", "folder": "Linux_x64", "os": "Linux", "arch": "x86-64", "file": "libc_calls.asm", "code": "; Linux x86-64: C standard library calls from assembly (System V ABI).\n; Build: make   Run: ./libc_calls\n; Convention: args RDI RSI RDX RCX R8 R9, result RAX; for variadic calls (printf)\n;             AL = number of vector registers used (0 here).\n;             RSP must be 16-byte aligned at every \"call\".\n;             Callee-saved: RBX RBP R12-R15.\n; Shows: 1. fopen/fwrite/fread/fclose   2. malloc/free\n;        3. fork + execv + waitpid (create a process)\n;        4. mmap an executable page, copy machine code into it and call it\ndefault rel\nextern puts, printf, fopen, fwrite, fread, fclose, fflush\nextern malloc, free, fork, execv, waitpid, _exit, mmap, munmap\n\nsection .data\npath:    db \"/tmp/libc_demo.txt\", 0\nwmode:   db \"w\", 0\nrmode:   db \"r\", 0\ntext:    db \"written with fwrite\", 10\ntext_len equ $ - text\nh1:      db \"1. stdio: fopen/fwrite/fclose then fopen/fread/fclose\", 0\nf1:      db \"   read back %zu bytes: %s\", 0\nf2:      db \"2. malloc(64) returned %p, stored value %ld, now free()\", 10, 0\nh3:      db \"3. fork + execv(/bin/echo) + waitpid\", 0\nf3:      db \"   child %d finished with exit status %d\", 10, 0\nf4:      db \"4. executable page at %p: called generated code, it returned %d\", 10, 0\necho:    db \"/bin/echo\", 0\narg1:    db \"   hello from the child process\", 0\nargv:    dq echo, arg1, 0\n; machine code:  mov eax, 42 ; ret\ncode:    db 0xB8, 42, 0, 0, 0, 0xC3\ncode_len equ $ - code\n\nsection .bss\nbuf:     resb 64\nstatus:  resd 1\n\nsection .text\nglobal main\nmain:\n        push    rbp\n        mov     rbp, rsp\n        push    rbx\n        push    r12                     ; two pushes + rbp = aligned again\n\n        ; 1. stdio\n        lea     rdi, [h1]\n        call    puts wrt ..plt\n        lea     rdi, [path]\n        lea     rsi, [wmode]\n        call    fopen wrt ..plt\n        test    rax, rax\n        jz      .fail\n        mov     rbx, rax                ; FILE*\n        lea     rdi, [text]             ; fwrite(ptr, size, count, stream)\n        mov     esi, 1\n        mov     edx, text_len\n        mov     rcx, rbx\n        call    fwrite wrt ..plt\n        mov     rdi, rbx\n        call    fclose wrt ..plt\n        lea     rdi, [path]\n        lea     rsi, [rmode]\n        call    fopen wrt ..plt\n        test    rax, rax\n        jz      .fail\n        mov     rbx, rax\n        lea     rdi, [buf]              ; fread(ptr, size, count, stream)\n        mov     esi, 1\n        mov     edx, 63\n        mov     rcx, rbx\n        call    fread wrt ..plt\n        mov     r12, rax                ; bytes read\n        lea     rdx, [buf]\n        mov     byte [rdx + rax], 0     ; (rip-relative addressing cannot take an index)\n        mov     rdi, rbx\n        call    fclose wrt ..plt\n        lea     rdi, [f1]\n        mov     rsi, r12\n        lea     rdx, [buf]\n        xor     eax, eax\n        call    printf wrt ..plt\n\n        ; 2. malloc / free\n        mov     edi, 64\n        call    malloc wrt ..plt\n        test    rax, rax\n        jz      .fail\n        mov     rbx, rax\n        mov     qword [rbx], 12345\n        lea     rdi, [f2]\n        mov     rsi, rbx\n        mov     rdx, [rbx]\n        xor     eax, eax\n        call    printf wrt ..plt\n        mov     rdi, rbx\n        call    free wrt ..plt\n\n        ; 3. fork / execv / waitpid\n        lea     rdi, [h3]\n        call    puts wrt ..plt\n        xor     edi, edi                ; fflush(NULL) flushes every stream, so the\n                                        ; child's copy of our buffer is empty\n        call    fflush wrt ..plt\n        call    fork wrt ..plt\n        test    eax, eax\n        js      .fail\n        jz      .child\n        mov     r12d, eax               ; child pid\n        mov     edi, eax\n        lea     rsi, [status]\n        xor     edx, edx\n        call    waitpid wrt ..plt\n        mov     eax, [status]\n        shr     eax, 8\n        and     eax, 0xFF               ; WEXITSTATUS\n        lea     rdi, [f3]\n        mov     esi, r12d\n        mov     edx, eax\n        xor     eax, eax\n        call    printf wrt ..plt\n        jmp     .exec_page\n.child:\n        lea     rdi, [echo]\n        lea     rsi, [argv]\n        call    execv wrt ..plt\n        mov     edi, 127                ; only reached if execv failed\n        call    _exit wrt ..plt\n\n        ; 4. executable memory\n.exec_page:\n        xor     edi, edi\n        mov     esi, 4096\n        mov     edx, 7                  ; PROT_READ | PROT_WRITE | PROT_EXEC\n        mov     ecx, 0x22               ; MAP_PRIVATE | MAP_ANONYMOUS\n        mov     r8, -1\n        xor     r9d, r9d\n        call    mmap wrt ..plt\n        cmp     rax, -1\n        je      .fail\n        mov     rbx, rax\n        lea     rsi, [code]\n        mov     rdi, rbx\n        mov     ecx, code_len\n        cld\n        rep movsb\n        call    rbx                     ; run the generated code\n        mov     r12d, eax\n        lea     rdi, [f4]\n        mov     rsi, rbx\n        mov     edx, r12d\n        xor     eax, eax\n        call    printf wrt ..plt\n        mov     rdi, rbx\n        mov     esi, 4096\n        call    munmap wrt ..plt\n\n        xor     eax, eax\n        jmp     .done\n.fail:\n        mov     eax, 1\n.done:\n        pop     r12\n        pop     rbx\n        pop     rbp\n        ret\n"}, {"id": "Linux_x86_32/syscalls.asm", "kind": "syscall", "dir": "Syscalls", "folder": "Linux_x86_32", "os": "Linux", "arch": "x86 (32-bit)", "file": "syscalls.asm", "code": "; Linux x86 (32-bit) raw system calls (no libc).  Build: make   Run: ./syscalls\n; Convention: syscall number in EAX, args in EBX, ECX, EDX, ESI, EDI, EBP.\n;             Execute \"int 0x80\".  Result in EAX (-4095..-1 means -errno).\n; Numbers: exit=1 read=3 write=4 open=5 close=6 getpid=20 munmap=91 mmap2=192\n; (mmap2 takes its file offset in 4096-byte pages; old \"mmap\"=90 takes a struct pointer.)\n\nSYS_exit   equ 1\nSYS_read   equ 3\nSYS_write  equ 4\nSYS_open   equ 5\nSYS_close  equ 6\nSYS_getpid equ 20\nSYS_munmap equ 91\nSYS_mmap2  equ 192\n\nsegment .data\nmsg:     db \"1. write: Hello from a raw Linux x86 syscall\", 10\nmsg_len  equ $ - msg\npidmsg:  db \"2. getpid: \"\npidmsg_len equ $ - pidmsg\nfilemsg: db \"3. open/read/close /etc/hosts (first 40 bytes):\", 10\nfilemsg_len equ $ - filemsg\nmapmsg:  db \"4. mmap2: wrote this text into an anonymous page\", 10\nmapmsg_len equ $ - mapmsg\npath:    db \"/etc/hosts\", 0\nnl:      db 10\n\nsegment .bss\nnumbuf:  resb 24\nrdbuf:   resb 40\n\nsegment .text\nglobal _start\n\n; write(1, ecx, edx)\ndo_write:\n        mov     ebx, 1\n        mov     eax, SYS_write\n        int     0x80\n        ret\n\n; print EDI as decimal + newline\nprint_dec:\n        mov     ecx, numbuf + 20\n        mov     byte [ecx], 10\n        mov     eax, edi\n        mov     esi, 10\n.next:  xor     edx, edx\n        div     esi\n        add     dl, '0'\n        dec     ecx\n        mov     [ecx], dl\n        test    eax, eax\n        jnz     .next\n        mov     edx, numbuf + 21\n        sub     edx, ecx\n        jmp     do_write\n\n_start:\n        ; 1. write\n        mov     ecx, msg\n        mov     edx, msg_len\n        call    do_write\n\n        ; 2. getpid\n        mov     ecx, pidmsg\n        mov     edx, pidmsg_len\n        call    do_write\n        mov     eax, SYS_getpid\n        int     0x80\n        mov     edi, eax\n        call    print_dec\n\n        ; 3. open / read / write / close\n        mov     ecx, filemsg\n        mov     edx, filemsg_len\n        call    do_write\n        mov     eax, SYS_open\n        mov     ebx, path\n        xor     ecx, ecx                ; O_RDONLY\n        xor     edx, edx\n        int     0x80\n        test    eax, eax\n        js      .fail\n        mov     ebp, eax                ; fd\n        mov     eax, SYS_read\n        mov     ebx, ebp\n        mov     ecx, rdbuf\n        mov     edx, 40\n        int     0x80\n        test    eax, eax\n        js      .fail\n        mov     edx, eax\n        mov     ecx, rdbuf\n        call    do_write\n        mov     ecx, nl\n        mov     edx, 1\n        call    do_write\n        mov     eax, SYS_close\n        mov     ebx, ebp\n        int     0x80\n\n        ; 4. mmap2(NULL, 4096, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0)\n        mov     eax, SYS_mmap2\n        xor     ebx, ebx\n        mov     ecx, 4096\n        mov     edx, 3\n        mov     esi, 0x22\n        mov     edi, -1\n        xor     ebp, ebp\n        int     0x80\n        cmp     eax, -4095\n        ja      .fail\n        mov     ebp, eax                ; page address\n        mov     esi, mapmsg\n        mov     edi, ebp\n        mov     ecx, mapmsg_len\n        cld\n        rep movsb\n        mov     ecx, ebp\n        mov     edx, mapmsg_len\n        call    do_write\n        mov     eax, SYS_munmap\n        mov     ebx, ebp\n        mov     ecx, 4096\n        int     0x80\n\n        ; 5. exit(0)\n        xor     ebx, ebx\n        mov     eax, SYS_exit\n        int     0x80\n.fail:\n        mov     ebx, 1\n        mov     eax, SYS_exit\n        int     0x80\n"}, {"id": "Libc/Linux_x86_32/libc_calls.asm", "kind": "libc", "dir": "Libc", "folder": "Linux_x86_32", "os": "Linux", "arch": "x86 (32-bit)", "file": "libc_calls.asm", "code": "; Linux x86 (32-bit): C standard library calls from assembly (cdecl).\n; Build: make   Run: ./libc_calls\n; Convention: args are PUSHED right-to-left (here: stored at [esp], [esp+4], ...\n;             in a block reserved once), result in EAX, the caller removes the args.\n;             ESP should be 16-byte aligned at every \"call\" (modern glibc expects it).\n;             Callee-saved: EBX ESI EDI EBP.\n; Shows: 1. fopen/fwrite/fread/fclose   2. malloc/free\n;        3. fork + execv + waitpid (create a process)\n;        4. mmap an executable page, copy machine code into it and call it\n\nextern puts, printf, fopen, fwrite, fread, fclose, fflush\nextern malloc, free, fork, execv, waitpid, _exit, mmap, munmap\n\nsection .data\npath:    db \"/tmp/libc_demo32.txt\", 0\nwmode:   db \"w\", 0\nrmode:   db \"r\", 0\ntext:    db \"written with fwrite\", 10\ntext_len equ $ - text\nh1:      db \"1. stdio: fopen/fwrite/fclose then fopen/fread/fclose\", 0\nf1:      db \"   read back %d bytes: %s\", 0\nf2:      db \"2. malloc(64) returned %p, stored value %d, now free()\", 10, 0\nh3:      db \"3. fork + execv(/bin/echo) + waitpid\", 0\nf3:      db \"   child %d finished with exit status %d\", 10, 0\nf4:      db \"4. executable page at %p: called generated code, it returned %d\", 10, 0\necho:    db \"/bin/echo\", 0\narg1:    db \"   hello from the child process\", 0\nargv:    dd echo, arg1, 0\n; machine code:  mov eax, 42 ; ret\ncode:    db 0xB8, 42, 0, 0, 0, 0xC3\ncode_len equ $ - code\n\nsection .bss\nbuf:     resb 64\nstatus:  resd 1\n\nsection .text\nglobal main\nmain:\n        push    ebp\n        mov     ebp, esp\n        push    ebx\n        push    esi                     ; entry ESP = 12 mod 16, three pushes -> aligned\n        sub     esp, 32                 ; room for outgoing arguments, keeps alignment\n\n        ; 1. stdio\n        mov     dword [esp], h1\n        call    puts\n        mov     dword [esp], path\n        mov     dword [esp + 4], wmode\n        call    fopen\n        test    eax, eax\n        jz      .fail\n        mov     ebx, eax                ; FILE*\n        mov     dword [esp], text       ; fwrite(ptr, size, count, stream)\n        mov     dword [esp + 4], 1\n        mov     dword [esp + 8], text_len\n        mov     [esp + 12], ebx\n        call    fwrite\n        mov     [esp], ebx\n        call    fclose\n        mov     dword [esp], path\n        mov     dword [esp + 4], rmode\n        call    fopen\n        test    eax, eax\n        jz      .fail\n        mov     ebx, eax\n        mov     dword [esp], buf        ; fread(ptr, size, count, stream)\n        mov     dword [esp + 4], 1\n        mov     dword [esp + 8], 63\n        mov     [esp + 12], ebx\n        call    fread\n        mov     esi, eax                ; bytes read\n        mov     byte [buf + esi], 0\n        mov     [esp], ebx\n        call    fclose\n        mov     dword [esp], f1\n        mov     [esp + 4], esi\n        mov     dword [esp + 8], buf\n        call    printf\n\n        ; 2. malloc / free\n        mov     dword [esp], 64\n        call    malloc\n        test    eax, eax\n        jz      .fail\n        mov     ebx, eax\n        mov     dword [ebx], 12345\n        mov     dword [esp], f2\n        mov     [esp + 4], ebx\n        mov     eax, [ebx]\n        mov     [esp + 8], eax\n        call    printf\n        mov     [esp], ebx\n        call    free\n\n        ; 3. fork / execv / waitpid\n        mov     dword [esp], h3\n        call    puts\n        mov     dword [esp], 0          ; fflush(NULL): the child must not repeat our output\n        call    fflush\n        call    fork\n        test    eax, eax\n        js      .fail\n        jz      .child\n        mov     esi, eax                ; child pid\n        mov     [esp], eax\n        mov     dword [esp + 4], status\n        mov     dword [esp + 8], 0\n        call    waitpid\n        mov     eax, [status]\n        shr     eax, 8\n        and     eax, 0xFF               ; WEXITSTATUS\n        mov     dword [esp], f3\n        mov     [esp + 4], esi\n        mov     [esp + 8], eax\n        call    printf\n        jmp     .exec_page\n.child:\n        mov     dword [esp], echo\n        mov     dword [esp + 4], argv\n        call    execv\n        mov     dword [esp], 127        ; only reached if execv failed\n        call    _exit\n\n        ; 4. executable memory\n.exec_page:\n        mov     dword [esp], 0          ; mmap(0, 4096, RWX, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0)\n        mov     dword [esp + 4], 4096\n        mov     dword [esp + 8], 7\n        mov     dword [esp + 12], 0x22\n        mov     dword [esp + 16], -1\n        mov     dword [esp + 20], 0\n        call    mmap\n        cmp     eax, -1\n        je      .fail\n        mov     ebx, eax\n        mov     esi, code\n        mov     edi, ebx\n        mov     ecx, code_len\n        cld\n        rep movsb\n        call    ebx                     ; run the generated code\n        mov     dword [esp], f4\n        mov     [esp + 4], ebx\n        mov     [esp + 8], eax\n        call    printf\n        mov     [esp], ebx\n        mov     dword [esp + 4], 4096\n        call    munmap\n\n        xor     eax, eax\n        jmp     .done\n.fail:\n        mov     eax, 1\n.done:\n        add     esp, 32\n        pop     esi\n        pop     ebx\n        pop     ebp\n        ret\n"}, {"id": "Linux_ARM64/syscalls.s", "kind": "syscall", "dir": "Syscalls", "folder": "Linux_ARM64", "os": "Linux", "arch": "ARM64", "file": "syscalls.s", "code": "// Linux AArch64 raw system calls (no libc), GNU as syntax.  Build: make   Run: ./syscalls\n// Convention: syscall number in X8, args in X0..X5, execute \"svc #0\".\n//             Result in X0 (-4095..-1 means -errno).\n// Numbers (generic table; there is NO \"open\", use openat):\n//   openat=56 close=57 read=63 write=64 exit=93 getpid=172 munmap=215 mmap=222\n        .equ SYS_openat, 56\n        .equ SYS_close,  57\n        .equ SYS_read,   63\n        .equ SYS_write,  64\n        .equ SYS_exit,   93\n        .equ SYS_getpid, 172\n        .equ SYS_munmap, 215\n        .equ SYS_mmap,   222\n        .equ AT_FDCWD,   -100\n\n        .data\nmsg:      .ascii \"1. write: Hello from a raw Linux ARM64 syscall\\n\"\n        .equ msg_len, . - msg\npidmsg:   .ascii \"2. getpid: \"\n        .equ pidmsg_len, . - pidmsg\nfilemsg:  .ascii \"3. openat/read/close /etc/hosts (first 40 bytes):\\n\"\n        .equ filemsg_len, . - filemsg\nmapmsg:   .ascii \"4. mmap: wrote this text into an anonymous page\\n\"\n        .equ mapmsg_len, . - mapmsg\npath:     .asciz \"/etc/hosts\"\nnl:       .ascii \"\\n\"\n\n        .bss\nnumbuf:   .skip 24\nrdbuf:    .skip 40\n\n        .text\n        .global _start\n\n// do_write: x1 = buffer, x2 = length.  write(1, x1, x2)\ndo_write:\n        mov     x0, #1\n        mov     x8, #SYS_write\n        svc     #0\n        ret\n\n// print_dec: x0 = value; prints decimal + newline\nprint_dec:\n        mov     x9, x30                 // save return address (do_write is a leaf)\n        adrp    x1, numbuf\n        add     x1, x1, :lo12:numbuf\n        add     x1, x1, #20\n        mov     w3, #10\n        strb    w3, [x1]                // newline at the end\n        add     x4, x1, #1              // end of text\n        mov     x5, #10\n1:      udiv    x6, x0, x5\n        msub    x7, x6, x5, x0          // remainder\n        add     w7, w7, #'0'\n        sub     x1, x1, #1\n        strb    w7, [x1]\n        mov     x0, x6\n        cbnz    x0, 1b\n        sub     x2, x4, x1\n        mov     x30, x9\n        b       do_write                // tail call\n\n_start:\n        // 1. write\n        adrp    x1, msg\n        add     x1, x1, :lo12:msg\n        mov     x2, #msg_len\n        bl      do_write\n\n        // 2. getpid\n        adrp    x1, pidmsg\n        add     x1, x1, :lo12:pidmsg\n        mov     x2, #pidmsg_len\n        bl      do_write\n        mov     x8, #SYS_getpid\n        svc     #0\n        bl      print_dec\n\n        // 3. openat / read / write / close\n        adrp    x1, filemsg\n        add     x1, x1, :lo12:filemsg\n        mov     x2, #filemsg_len\n        bl      do_write\n        mov     x0, #AT_FDCWD\n        adrp    x1, path\n        add     x1, x1, :lo12:path\n        mov     x2, #0                  // O_RDONLY\n        mov     x3, #0\n        mov     x8, #SYS_openat\n        svc     #0\n        tbnz    x0, #63, fail\n        mov     x19, x0                 // fd\n        adrp    x1, rdbuf\n        add     x1, x1, :lo12:rdbuf\n        mov     x2, #40\n        mov     x8, #SYS_read\n        svc     #0\n        tbnz    x0, #63, fail\n        mov     x2, x0\n        adrp    x1, rdbuf\n        add     x1, x1, :lo12:rdbuf\n        bl      do_write\n        adrp    x1, nl\n        add     x1, x1, :lo12:nl\n        mov     x2, #1\n        bl      do_write\n        mov     x0, x19\n        mov     x8, #SYS_close\n        svc     #0\n\n        // 4. mmap(NULL, 4096, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0)\n        mov     x0, #0\n        mov     x1, #4096\n        mov     x2, #3\n        mov     x3, #0x22\n        mov     x4, #-1\n        mov     x5, #0\n        mov     x8, #SYS_mmap\n        svc     #0\n        cmn     x0, #4095               // x0 >= -4095 (unsigned) means error\n        b.hi    fail\n        mov     x20, x0                 // page address\n        adrp    x1, mapmsg\n        add     x1, x1, :lo12:mapmsg\n        mov     x2, #mapmsg_len\n        mov     x3, x20\n2:      ldrb    w4, [x1], #1            // copy text into the new page\n        strb    w4, [x3], #1\n        subs    x2, x2, #1\n        b.ne    2b\n        mov     x1, x20\n        mov     x2, #mapmsg_len\n        bl      do_write\n        mov     x0, x20\n        mov     x1, #4096\n        mov     x8, #SYS_munmap\n        svc     #0\n\n        // 5. exit(0)\n        mov     x0, #0\n        mov     x8, #SYS_exit\n        svc     #0\nfail:\n        mov     x0, #1\n        mov     x8, #SYS_exit\n        svc     #0\n"}, {"id": "Libc/Linux_ARM64/libc_calls.s", "kind": "libc", "dir": "Libc", "folder": "Linux_ARM64", "os": "Linux", "arch": "ARM64", "file": "libc_calls.s", "code": "// Linux AArch64: C standard library calls from assembly (AAPCS64), GNU as syntax.\n// Build: make   Run: ./libc_calls\n// Convention: args X0..X7, result X0, return address in X30 (so non-leaf code must\n//             save it: stp x29, x30), SP 16-byte aligned, X19-X28 callee-saved.\n//             Variadic calls (printf) just use X0..X7 the same way on Linux.\n// Shows: 1. fopen/fwrite/fread/fclose   2. malloc/free\n//        3. fork + execv + waitpid (create a process)\n//        4. mmap an executable page, copy machine code into it and call it\n//           (needs __clear_cache: instruction and data caches are separate on ARM)\n        .macro ldaddr reg, sym\n        adrp    \\reg, \\sym\n        add     \\reg, \\reg, :lo12:\\sym\n        .endm\n\n        .data\npath:    .asciz \"/tmp/libc_demo_a64.txt\"\nwmode:   .asciz \"w\"\nrmode:   .asciz \"r\"\ntext:    .ascii \"written with fwrite\\n\"\n        .equ text_len, . - text\nh1:      .asciz \"1. stdio: fopen/fwrite/fclose then fopen/fread/fclose\"\nf1:      .asciz \"   read back %zu bytes: %s\"\nf2:      .asciz \"2. malloc(64) returned %p, stored value %ld, now free()\\n\"\nh3:      .asciz \"3. fork + execv(/bin/echo) + waitpid\"\nf3:      .asciz \"   child %d finished with exit status %d\\n\"\nf4:      .asciz \"4. executable page at %p: called generated code, it returned %d\\n\"\necho:    .asciz \"/bin/echo\"\narg1:    .asciz \"   hello from the child process\"\n        .align 3\nargv:    .quad echo, arg1, 0\n// machine code:  mov w0, #42 ; ret\ncode:    .word 0x52800540, 0xd65f03c0\n        .equ code_len, . - code\n\n        .bss\n        .align 3\nbuf:     .skip 64\nstatus:  .skip 8\n\n        .text\n        .global main\nmain:\n        stp     x29, x30, [sp, #-48]!\n        mov     x29, sp\n        stp     x19, x20, [sp, #16]\n        str     x21, [sp, #32]\n\n        // 1. stdio\n        ldaddr  x0, h1\n        bl      puts\n        ldaddr  x0, path\n        ldaddr  x1, wmode\n        bl      fopen\n        cbz     x0, fail\n        mov     x19, x0                 // FILE*\n        mov     x3, x0                  // fwrite(ptr, size, count, stream)\n        ldaddr  x0, text\n        mov     x1, #1\n        mov     x2, #text_len\n        bl      fwrite\n        mov     x0, x19\n        bl      fclose\n        ldaddr  x0, path\n        ldaddr  x1, rmode\n        bl      fopen\n        cbz     x0, fail\n        mov     x19, x0\n        mov     x3, x0                  // fread(ptr, size, count, stream)\n        ldaddr  x0, buf\n        mov     x1, #1\n        mov     x2, #63\n        bl      fread\n        mov     x20, x0                 // bytes read\n        ldaddr  x1, buf\n        strb    wzr, [x1, x20]          // zero terminator\n        mov     x0, x19\n        bl      fclose\n        ldaddr  x0, f1\n        mov     x1, x20\n        ldaddr  x2, buf\n        bl      printf\n\n        // 2. malloc / free\n        mov     x0, #64\n        bl      malloc\n        cbz     x0, fail\n        mov     x19, x0\n        mov     x1, #12345\n        str     x1, [x19]\n        ldaddr  x0, f2\n        mov     x1, x19\n        ldr     x2, [x19]\n        bl      printf\n        mov     x0, x19\n        bl      free\n\n        // 3. fork / execv / waitpid\n        ldaddr  x0, h3\n        bl      puts\n        mov     x0, #0\n        bl      fflush                  // fflush(NULL): child must not repeat our output\n        bl      fork\n        cmp     w0, #0\n        blt     fail\n        beq     child\n        mov     w19, w0                 // child pid\n        ldaddr  x1, status\n        mov     w2, #0\n        bl      waitpid\n        ldaddr  x1, status\n        ldr     w2, [x1]\n        ubfx    w2, w2, #8, #8          // WEXITSTATUS\n        ldaddr  x0, f3\n        mov     w1, w19\n        bl      printf\n        b       exec_page\nchild:\n        ldaddr  x0, echo\n        ldaddr  x1, argv\n        bl      execv\n        mov     w0, #127                // only reached if execv failed\n        bl      _exit\n\n        // 4. executable memory\nexec_page:\n        mov     x0, #0\n        mov     x1, #4096\n        mov     x2, #7                  // PROT_READ | PROT_WRITE | PROT_EXEC\n        mov     x3, #0x22               // MAP_PRIVATE | MAP_ANONYMOUS\n        mov     x4, #-1\n        mov     x5, #0\n        bl      mmap\n        cmn     x0, #1\n        beq     fail\n        mov     x19, x0\n        ldaddr  x1, code\n        mov     x2, #code_len\n        mov     x3, x19\n1:      ldrb    w4, [x1], #1\n        strb    w4, [x3], #1\n        subs    x2, x2, #1\n        b.ne    1b\n        mov     x0, x19                 // __clear_cache(begin, end)\n        add     x1, x19, #code_len\n        bl      __clear_cache\n        blr     x19                     // run the generated code\n        mov     w2, w0\n        ldaddr  x0, f4\n        mov     x1, x19\n        bl      printf\n        mov     x0, x19\n        mov     x1, #4096\n        bl      munmap\n\n        mov     w0, #0\n        b       done\nfail:\n        mov     w0, #1\ndone:\n        ldr     x21, [sp, #32]\n        ldp     x19, x20, [sp, #16]\n        ldp     x29, x30, [sp], #48\n        ret\n"}, {"id": "Linux_ARM32/syscalls.s", "kind": "syscall", "dir": "Syscalls", "folder": "Linux_ARM32", "os": "Linux", "arch": "ARM (32-bit)", "file": "syscalls.s", "code": "@ Linux ARM (32-bit, EABI) raw system calls (no libc), GNU as syntax.\n@ Build: make   Run: ./syscalls\n@ Convention: syscall number in R7, args in R0..R6, execute \"svc #0\".\n@             Result in R0 (-4095..-1 means -errno).\n@ Numbers: exit=1 read=3 write=4 open=5 close=6 getpid=20 munmap=91 mmap2=192\n@ (same table as 32-bit x86).  Uses udiv, so it needs ARMv7 with the divide\n@ extension (Raspberry Pi 2 and later, or qemu-arm).\n        .arch armv7-a\n        .arch_extension idiv\n        .equ SYS_exit,   1\n        .equ SYS_read,   3\n        .equ SYS_write,  4\n        .equ SYS_open,   5\n        .equ SYS_close,  6\n        .equ SYS_getpid, 20\n        .equ SYS_munmap, 91\n        .equ SYS_mmap2,  192\n\n        .data\nmsg:      .ascii \"1. write: Hello from a raw Linux ARM32 syscall\\n\"\n        .equ msg_len, . - msg\npidmsg:   .ascii \"2. getpid: \"\n        .equ pidmsg_len, . - pidmsg\nfilemsg:  .ascii \"3. open/read/close /etc/hosts (first 40 bytes):\\n\"\n        .equ filemsg_len, . - filemsg\nmapmsg:   .ascii \"4. mmap2: wrote this text into an anonymous page\\n\"\n        .equ mapmsg_len, . - mapmsg\npath:     .asciz \"/etc/hosts\"\nnl:       .ascii \"\\n\"\n\n        .bss\n        .align 2\nnumbuf:   .skip 24\nrdbuf:    .skip 40\n\n        .text\n        .global _start\n\n@ do_write: r1 = buffer, r2 = length.  write(1, r1, r2)\ndo_write:\n        mov     r0, #1\n        mov     r7, #SYS_write\n        svc     #0\n        bx      lr\n\n@ print_dec: r0 = value; prints decimal + newline\nprint_dec:\n        mov     r9, lr\n        ldr     r1, =numbuf\n        add     r1, r1, #20\n        mov     r3, #10\n        strb    r3, [r1]                @ newline at the end\n        add     r4, r1, #1              @ end of text\n        mov     r5, #10\n1:      udiv    r6, r0, r5\n        mls     r3, r6, r5, r0          @ remainder = r0 - r6*10\n        add     r3, r3, #'0'\n        sub     r1, r1, #1\n        strb    r3, [r1]\n        movs    r0, r6\n        bne     1b\n        sub     r2, r4, r1\n        mov     lr, r9\n        b       do_write\n\n_start:\n        @ 1. write\n        ldr     r1, =msg\n        mov     r2, #msg_len\n        bl      do_write\n\n        @ 2. getpid\n        ldr     r1, =pidmsg\n        mov     r2, #pidmsg_len\n        bl      do_write\n        mov     r7, #SYS_getpid\n        svc     #0\n        bl      print_dec\n\n        @ 3. open / read / write / close\n        ldr     r1, =filemsg\n        mov     r2, #filemsg_len\n        bl      do_write\n        ldr     r0, =path\n        mov     r1, #0                  @ O_RDONLY\n        mov     r2, #0\n        mov     r7, #SYS_open\n        svc     #0\n        cmp     r0, #0\n        blt     fail\n        mov     r8, r0                  @ fd\n        ldr     r1, =rdbuf\n        mov     r2, #40\n        mov     r7, #SYS_read\n        svc     #0\n        cmp     r0, #0\n        blt     fail\n        mov     r2, r0\n        ldr     r1, =rdbuf\n        bl      do_write\n        ldr     r1, =nl\n        mov     r2, #1\n        bl      do_write\n        mov     r0, r8\n        mov     r7, #SYS_close\n        svc     #0\n\n        @ 4. mmap2(NULL, 4096, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0)\n        mov     r0, #0\n        ldr     r1, =4096\n        mov     r2, #3\n        mov     r3, #0x22\n        mvn     r4, #0                  @ fd = -1\n        mov     r5, #0                  @ offset (in pages)\n        mov     r7, #SYS_mmap2\n        svc     #0\n        cmn     r0, #4096               @ carry set if r0 >= -4096 (unsigned) = -errno\n        bcs     fail\n        mov     r10, r0                 @ page address\n        ldr     r1, =mapmsg\n        mov     r2, #mapmsg_len\n        mov     r3, r10\n2:      ldrb    r4, [r1], #1            @ copy text into the new page\n        strb    r4, [r3], #1\n        subs    r2, r2, #1\n        bne     2b\n        mov     r1, r10\n        mov     r2, #mapmsg_len\n        bl      do_write\n        mov     r0, r10\n        ldr     r1, =4096\n        mov     r7, #SYS_munmap\n        svc     #0\n\n        @ 5. exit(0)\n        mov     r0, #0\n        mov     r7, #SYS_exit\n        svc     #0\nfail:\n        mov     r0, #1\n        mov     r7, #SYS_exit\n        svc     #0\n"}, {"id": "Libc/Linux_ARM32/libc_calls.s", "kind": "libc", "dir": "Libc", "folder": "Linux_ARM32", "os": "Linux", "arch": "ARM (32-bit)", "file": "libc_calls.s", "code": "@ Linux ARM (32-bit, hard-float EABI): C standard library calls from assembly.\n@ Build: make   Run: ./libc_calls\n@ Convention: args R0-R3 then the stack, result R0, return address in LR (non-leaf\n@             code must save it), SP 8-byte aligned at calls, R4-R11 callee-saved.\n@ Shows: 1. fopen/fwrite/fread/fclose   2. malloc/free\n@        3. fork + execv + waitpid (create a process)\n@        4. mmap an executable page, copy machine code into it and call it\n@           (needs __clear_cache: instruction and data caches are separate on ARM)\n        .arch armv7-a\n        .data\npath:    .asciz \"/tmp/libc_demo_a32.txt\"\nwmode:   .asciz \"w\"\nrmode:   .asciz \"r\"\ntext:    .ascii \"written with fwrite\\n\"\n        .equ text_len, . - text\nh1:      .asciz \"1. stdio: fopen/fwrite/fclose then fopen/fread/fclose\"\nf1:      .asciz \"   read back %u bytes: %s\"\nf2:      .asciz \"2. malloc(64) returned %p, stored value %d, now free()\\n\"\nh3:      .asciz \"3. fork + execv(/bin/echo) + waitpid\"\nf3:      .asciz \"   child %d finished with exit status %d\\n\"\nf4:      .asciz \"4. executable page at %p: called generated code, it returned %d\\n\"\necho:    .asciz \"/bin/echo\"\narg1:    .asciz \"   hello from the child process\"\n        .align 2\nargv:    .word echo, arg1, 0\n@ machine code (ARM state):  mov r0, #42 ; bx lr\ncode:    .word 0xE3A0002A, 0xE12FFF1E\n        .equ code_len, . - code\n\n        .bss\n        .align 2\nbuf:     .skip 64\nstatus:  .skip 4\n\n        .text\n        .global main\nmain:\n        push    {r4-r8, lr}             @ 24 bytes: SP stays 8-byte aligned\n        sub     sp, sp, #8              @ two outgoing stack-argument slots\n\n        @ 1. stdio\n        ldr     r0, =h1\n        bl      puts\n        ldr     r0, =path\n        ldr     r1, =wmode\n        bl      fopen\n        cmp     r0, #0\n        beq     fail\n        mov     r4, r0                  @ FILE*\n        mov     r3, r0                  @ fwrite(ptr, size, count, stream)\n        ldr     r0, =text\n        mov     r1, #1\n        mov     r2, #text_len\n        bl      fwrite\n        mov     r0, r4\n        bl      fclose\n        ldr     r0, =path\n        ldr     r1, =rmode\n        bl      fopen\n        cmp     r0, #0\n        beq     fail\n        mov     r4, r0\n        mov     r3, r0                  @ fread(ptr, size, count, stream)\n        ldr     r0, =buf\n        mov     r1, #1\n        mov     r2, #63\n        bl      fread\n        mov     r5, r0                  @ bytes read\n        ldr     r1, =buf\n        mov     r2, #0\n        strb    r2, [r1, r5]            @ zero terminator\n        mov     r0, r4\n        bl      fclose\n        ldr     r0, =f1\n        mov     r1, r5\n        ldr     r2, =buf\n        bl      printf\n\n        @ 2. malloc / free\n        mov     r0, #64\n        bl      malloc\n        cmp     r0, #0\n        beq     fail\n        mov     r4, r0\n        ldr     r1, =12345\n        str     r1, [r4]\n        ldr     r0, =f2\n        mov     r1, r4\n        ldr     r2, [r4]\n        bl      printf\n        mov     r0, r4\n        bl      free\n\n        @ 3. fork / execv / waitpid\n        ldr     r0, =h3\n        bl      puts\n        mov     r0, #0\n        bl      fflush                  @ fflush(NULL): child must not repeat our output\n        bl      fork\n        cmp     r0, #0\n        blt     fail\n        beq     child\n        mov     r4, r0                  @ child pid\n        ldr     r1, =status\n        mov     r2, #0\n        bl      waitpid\n        ldr     r1, =status\n        ldr     r2, [r1]\n        ubfx    r2, r2, #8, #8          @ WEXITSTATUS\n        ldr     r0, =f3\n        mov     r1, r4\n        bl      printf\n        b       exec_page\nchild:\n        ldr     r0, =echo\n        ldr     r1, =argv\n        bl      execv\n        mov     r0, #127                @ only reached if execv failed\n        bl      _exit\n\n        @ 4. executable memory\nexec_page:\n        mov     r0, #0                  @ mmap(0, 4096, RWX, MAP_PRIVATE|MAP_ANONYMOUS, -1, 0)\n        ldr     r1, =4096\n        mov     r2, #7\n        mov     r3, #0x22\n        mvn     r4, #0\n        str     r4, [sp]                @ 5th argument: fd = -1\n        mov     r4, #0\n        str     r4, [sp, #4]            @ 6th argument: offset = 0\n        bl      mmap\n        cmn     r0, #1\n        beq     fail\n        mov     r4, r0\n        ldr     r1, =code\n        mov     r2, #code_len\n        mov     r3, r4\n1:      ldrb    r5, [r1], #1\n        strb    r5, [r3], #1\n        subs    r2, r2, #1\n        bne     1b\n        mov     r0, r4                  @ __clear_cache(begin, end)\n        add     r1, r4, #code_len\n        bl      __clear_cache\n        blx     r4                      @ run the generated code (even address = ARM state)\n        mov     r2, r0\n        ldr     r0, =f4\n        mov     r1, r4\n        bl      printf\n        mov     r0, r4\n        ldr     r1, =4096\n        bl      munmap\n\n        mov     r0, #0\n        b       done\nfail:\n        mov     r0, #1\ndone:\n        add     sp, sp, #8\n        pop     {r4-r8, pc}\n        .ltorg\n"}, {"id": "macOS_ARM64/syscalls.s", "kind": "syscall", "dir": "Syscalls", "folder": "macOS_ARM64", "os": "macOS", "arch": "ARM64", "file": "syscalls.s", "code": "// macOS Apple-silicon (arm64) raw BSD system calls.  Apple \"as\"/clang syntax.\n// Build: make   Run: ./syscalls\n// Convention: syscall number in X16, args in X0..X7, execute \"svc #0x80\".\n//             On error the CARRY flag is set and X0 holds the (positive) errno.\n//             (On x86-64 macOS the number needs the 0x2000000 BSD class prefix;\n//              on arm64 the plain BSD number is used.)\n// Numbers: exit=1 read=3 write=4 open=5 close=6 getpid=20 munmap=73 mmap=197\n// Apple warns that raw syscalls are not a stable ABI; libSystem (the C library)\n// is the supported interface.  We still link libSystem because dyld requires it.\n        .set SYS_exit,   1\n        .set SYS_read,   3\n        .set SYS_write,  4\n        .set SYS_open,   5\n        .set SYS_close,  6\n        .set SYS_getpid, 20\n        .set SYS_munmap, 73\n        .set SYS_mmap,   197\n\n        .section __DATA,__data\nmsg:      .ascii \"1. write: Hello from a raw macOS ARM64 syscall\\n\"\n        .set msg_len, . - msg\npidmsg:   .ascii \"2. getpid: \"\n        .set pidmsg_len, . - pidmsg\nfilemsg:  .ascii \"3. open/read/close /etc/hosts (first 40 bytes):\\n\"\n        .set filemsg_len, . - filemsg\nmapmsg:   .ascii \"4. mmap: wrote this text into an anonymous page\\n\"\n        .set mapmsg_len, . - mapmsg\npath:     .asciz \"/etc/hosts\"\nnl:       .ascii \"\\n\"\nnumbuf:   .space 24\nrdbuf:    .space 40\n\n        .text\n        .globl _start\n        .p2align 2\n\n// do_write: x1 = buffer, x2 = length.  write(1, x1, x2)\ndo_write:\n        mov     x0, #1\n        mov     x16, #SYS_write\n        svc     #0x80\n        ret\n\n// print_dec: x0 = value; prints decimal + newline\nprint_dec:\n        mov     x9, x30\n        adrp    x1, numbuf@PAGE\n        add     x1, x1, numbuf@PAGEOFF\n        add     x1, x1, #20\n        mov     w3, #10\n        strb    w3, [x1]\n        add     x4, x1, #1\n        mov     x5, #10\n1:      udiv    x6, x0, x5\n        msub    x7, x6, x5, x0\n        add     w7, w7, #'0'\n        sub     x1, x1, #1\n        strb    w7, [x1]\n        mov     x0, x6\n        cbnz    x0, 1b\n        sub     x2, x4, x1\n        mov     x30, x9\n        b       do_write\n\n_start:\n        // 1. write\n        adrp    x1, msg@PAGE\n        add     x1, x1, msg@PAGEOFF\n        mov     x2, #msg_len\n        bl      do_write\n\n        // 2. getpid\n        adrp    x1, pidmsg@PAGE\n        add     x1, x1, pidmsg@PAGEOFF\n        mov     x2, #pidmsg_len\n        bl      do_write\n        mov     x16, #SYS_getpid\n        svc     #0x80\n        bl      print_dec\n\n        // 3. open / read / write / close\n        adrp    x1, filemsg@PAGE\n        add     x1, x1, filemsg@PAGEOFF\n        mov     x2, #filemsg_len\n        bl      do_write\n        adrp    x0, path@PAGE\n        add     x0, x0, path@PAGEOFF\n        mov     x1, #0                  // O_RDONLY\n        mov     x2, #0\n        mov     x16, #SYS_open\n        svc     #0x80\n        b.cs    fail\n        mov     x19, x0                 // fd\n        adrp    x1, rdbuf@PAGE\n        add     x1, x1, rdbuf@PAGEOFF\n        mov     x2, #40\n        mov     x16, #SYS_read\n        svc     #0x80\n        b.cs    fail\n        mov     x2, x0\n        adrp    x1, rdbuf@PAGE\n        add     x1, x1, rdbuf@PAGEOFF\n        bl      do_write\n        adrp    x1, nl@PAGE\n        add     x1, x1, nl@PAGEOFF\n        mov     x2, #1\n        bl      do_write\n        mov     x0, x19\n        mov     x16, #SYS_close\n        svc     #0x80\n\n        // 4. mmap(NULL, 4096, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_ANON, -1, 0)\n        //    (macOS: MAP_PRIVATE=0x2, MAP_ANON=0x1000; Apple silicon pages are 16 KB,\n        //     so ask for 16384 to be safe)\n        mov     x0, #0\n        mov     x1, #16384\n        mov     x2, #3\n        mov     x3, #0x1002\n        mov     x4, #-1\n        mov     x5, #0\n        mov     x16, #SYS_mmap\n        svc     #0x80\n        b.cs    fail\n        mov     x20, x0                 // page address\n        adrp    x1, mapmsg@PAGE\n        add     x1, x1, mapmsg@PAGEOFF\n        mov     x2, #mapmsg_len\n        mov     x3, x20\n2:      ldrb    w4, [x1], #1\n        strb    w4, [x3], #1\n        subs    x2, x2, #1\n        b.ne    2b\n        mov     x1, x20\n        mov     x2, #mapmsg_len\n        bl      do_write\n        mov     x0, x20\n        mov     x1, #16384\n        mov     x16, #SYS_munmap\n        svc     #0x80\n\n        // 5. exit(0)\n        mov     x0, #0\n        mov     x16, #SYS_exit\n        svc     #0x80\nfail:\n        mov     x0, #1\n        mov     x16, #SYS_exit\n        svc     #0x80\n"}, {"id": "Libc/macOS_ARM64/libc_calls.s", "kind": "libc", "dir": "Libc", "folder": "macOS_ARM64", "os": "macOS", "arch": "ARM64", "file": "libc_calls.s", "code": "// macOS Apple silicon (arm64): C standard library calls from assembly.  Apple \"as\" syntax.\n// Build: make   Run: ./libc_calls\n// Convention: args X0..X7, result X0, SP 16-byte aligned, X19-X28 callee-saved.\n//   !! Apple differs from Linux for VARIADIC functions (printf): the fixed arguments\n//   !! (the format string) go in registers, but every variadic argument is stored on\n//   !! the STACK, in 8-byte slots.  The \"printf2\" macro below does that.\n// macOS differences: C symbols get a leading underscore (_puts); data is addressed\n//   with sym@PAGE / sym@PAGEOFF; MAP_ANON is 0x1000.\n// Shows: 1. fopen/fwrite/fread/fclose   2. malloc/free\n//        3. fork + execv + waitpid (create a process)\n//        4. executable memory.  Apple silicon enforces W^X: map with MAP_JIT, switch\n//           the thread to \"write\" mode, copy the code, switch back to \"execute\"\n//           mode, flush the instruction cache, then call it.\n        .macro ldaddr reg, sym\n        adrp    \\reg, \\sym@PAGE\n        add     \\reg, \\reg, \\sym@PAGEOFF\n        .endm\n\n        // printf2 fmt, a, b : variadic args a and b go on the stack\n        .macro printf2 fmt, a, b\n        ldaddr  x0, \\fmt\n        sub     sp, sp, #16\n        str     \\a, [sp]\n        str     \\b, [sp, #8]\n        bl      _printf\n        add     sp, sp, #16\n        .endm\n\n        .section __DATA,__data\npath:    .asciz \"/tmp/libc_demo_mac_arm.txt\"\nwmode:   .asciz \"w\"\nrmode:   .asciz \"r\"\ntext:    .ascii \"written with fwrite\\n\"\n        .set text_len, . - text\nh1:      .asciz \"1. stdio: fopen/fwrite/fclose then fopen/fread/fclose\"\nf1:      .asciz \"   read back %zu bytes: %s\"\nf2:      .asciz \"2. malloc(64) returned %p, stored value %ld, now free()\\n\"\nh3:      .asciz \"3. fork + execv(/bin/echo) + waitpid\"\nf3:      .asciz \"   child %d finished with exit status %d\\n\"\nf4:      .asciz \"4. executable page at %p: called generated code, it returned %d\\n\"\necho:    .asciz \"/bin/echo\"\narg1:    .asciz \"   hello from the child process\"\n        .p2align 3\nargv:    .quad echo, arg1, 0\n// machine code:  mov w0, #42 ; ret\ncode:    .long 0x52800540, 0xd65f03c0\n        .set code_len, . - code\nbuf:     .space 64\nstatus:  .space 8\n\n        .text\n        .globl _main\n        .p2align 2\n_main:\n        stp     x29, x30, [sp, #-48]!\n        mov     x29, sp\n        stp     x19, x20, [sp, #16]\n        str     x21, [sp, #32]\n\n        // 1. stdio\n        ldaddr  x0, h1\n        bl      _puts\n        ldaddr  x0, path\n        ldaddr  x1, wmode\n        bl      _fopen\n        cbz     x0, fail\n        mov     x19, x0                 // FILE*\n        mov     x3, x0                  // fwrite(ptr, size, count, stream)\n        ldaddr  x0, text\n        mov     x1, #1\n        mov     x2, #text_len\n        bl      _fwrite\n        mov     x0, x19\n        bl      _fclose\n        ldaddr  x0, path\n        ldaddr  x1, rmode\n        bl      _fopen\n        cbz     x0, fail\n        mov     x19, x0\n        mov     x3, x0                  // fread(ptr, size, count, stream)\n        ldaddr  x0, buf\n        mov     x1, #1\n        mov     x2, #63\n        bl      _fread\n        mov     x20, x0                 // bytes read\n        ldaddr  x1, buf\n        strb    wzr, [x1, x20]          // zero terminator\n        mov     x0, x19\n        bl      _fclose\n        ldaddr  x2, buf\n        printf2 f1, x20, x2\n\n        // 2. malloc / free\n        mov     x0, #64\n        bl      _malloc\n        cbz     x0, fail\n        mov     x19, x0\n        mov     x1, #12345\n        str     x1, [x19]\n        ldr     x2, [x19]\n        printf2 f2, x19, x2\n        mov     x0, x19\n        bl      _free\n\n        // 3. fork / execv / waitpid\n        ldaddr  x0, h3\n        bl      _puts\n        mov     x0, #0\n        bl      _fflush                 // fflush(NULL): child must not repeat our output\n        bl      _fork\n        cmp     w0, #0\n        b.lt    fail\n        b.eq    child\n        mov     w19, w0                 // child pid\n        ldaddr  x1, status\n        mov     w2, #0\n        bl      _waitpid\n        ldaddr  x1, status\n        ldr     w2, [x1]\n        ubfx    w2, w2, #8, #8          // WEXITSTATUS\n        sxtw    x1, w19\n        uxtw    x2, w2\n        printf2 f3, x1, x2\n        b       exec_page\nchild:\n        ldaddr  x0, echo\n        ldaddr  x1, argv\n        bl      _execv\n        mov     w0, #127                // only reached if execv failed\n        bl      __exit\n\n        // 4. executable memory (MAP_JIT)\nexec_page:\n        mov     x0, #0\n        mov     x1, #16384              // Apple silicon page size\n        mov     x2, #7                  // PROT_READ | PROT_WRITE | PROT_EXEC\n        mov     x3, #0x1802             // MAP_PRIVATE | MAP_ANON | MAP_JIT (0x800)\n        mov     x4, #-1\n        mov     x5, #0\n        bl      _mmap\n        cmn     x0, #1\n        b.eq    fail\n        mov     x19, x0\n        mov     w0, #0\n        bl      _pthread_jit_write_protect_np   // 0 = this thread may write JIT memory\n        ldaddr  x1, code\n        mov     x2, #code_len\n        mov     x3, x19\n1:      ldrb    w4, [x1], #1\n        strb    w4, [x3], #1\n        subs    x2, x2, #1\n        b.ne    1b\n        mov     w0, #1\n        bl      _pthread_jit_write_protect_np   // 1 = back to execute mode\n        mov     x0, x19\n        mov     x1, #code_len\n        bl      _sys_icache_invalidate\n        blr     x19                     // run the generated code\n        mov     w2, w0\n        sxtw    x2, w2\n        printf2 f4, x19, x2\n        mov     x0, x19\n        mov     x1, #16384\n        bl      _munmap\n\n        mov     w0, #0\n        b       done\nfail:\n        mov     w0, #1\ndone:\n        ldr     x21, [sp, #32]\n        ldp     x19, x20, [sp, #16]\n        ldp     x29, x30, [sp], #48\n        ret\n"}, {"id": "macOS_x64/syscalls.asm", "kind": "syscall", "dir": "Syscalls", "folder": "macOS_x64", "os": "macOS", "arch": "x86-64", "file": "syscalls.asm", "code": "; macOS x86-64 (Intel, or Apple silicon under Rosetta) raw BSD system calls.\n; Build: make   Run: ./syscalls\n; Convention: syscall number in RAX = 0x2000000 + BSD number (class 2 = BSD),\n;             args in RDI, RSI, RDX, R10, R8, R9.  Execute \"syscall\".\n;             On error the CARRY flag is set and RAX holds the (positive) errno.\n;             RCX, R11 (and RDX on some calls) are destroyed.\n; Numbers: exit=1 read=3 write=4 open=5 close=6 getpid=20 munmap=73 mmap=197\n; Apple does not promise raw syscalls stay stable; libSystem is the supported API.\ndefault rel\n\nBSD         equ 0x2000000\nSYS_exit    equ BSD + 1\nSYS_read    equ BSD + 3\nSYS_write   equ BSD + 4\nSYS_open    equ BSD + 5\nSYS_close   equ BSD + 6\nSYS_getpid  equ BSD + 20\nSYS_munmap  equ BSD + 73\nSYS_mmap    equ BSD + 197\n\nsection .data\nmsg:     db \"1. write: Hello from a raw macOS x64 syscall\", 10\nmsg_len  equ $ - msg\npidmsg:  db \"2. getpid: \"\npidmsg_len equ $ - pidmsg\nfilemsg: db \"3. open/read/close /etc/hosts (first 40 bytes):\", 10\nfilemsg_len equ $ - filemsg\nmapmsg:  db \"4. mmap: wrote this text into an anonymous page\", 10\nmapmsg_len equ $ - mapmsg\npath:    db \"/etc/hosts\", 0\nnl:      db 10\n\nsection .bss\nnumbuf:  resb 24\nrdbuf:   resb 40\n\nsection .text\nglobal _start\n\n; write(1, rsi, rdx)\ndo_write:\n        mov     edi, 1\n        mov     eax, SYS_write\n        syscall\n        ret\n\n; print RDI as decimal + newline\nprint_dec:\n        lea     rsi, [numbuf + 20]\n        mov     byte [rsi], 10\n        mov     rax, rdi\n        mov     ecx, 10\n.next:  xor     edx, edx\n        div     rcx\n        add     dl, '0'\n        dec     rsi\n        mov     [rsi], dl\n        test    rax, rax\n        jnz     .next\n        lea     rdx, [numbuf + 21]\n        sub     rdx, rsi\n        jmp     do_write\n\n_start:\n        ; 1. write\n        lea     rsi, [msg]\n        mov     edx, msg_len\n        call    do_write\n\n        ; 2. getpid\n        lea     rsi, [pidmsg]\n        mov     edx, pidmsg_len\n        call    do_write\n        mov     eax, SYS_getpid\n        syscall\n        mov     rdi, rax\n        call    print_dec\n\n        ; 3. open / read / write / close\n        lea     rsi, [filemsg]\n        mov     edx, filemsg_len\n        call    do_write\n        mov     eax, SYS_open\n        lea     rdi, [path]\n        xor     esi, esi                ; O_RDONLY\n        xor     edx, edx\n        syscall\n        jc      .fail                   ; carry = error\n        mov     r12, rax                ; fd\n        mov     eax, SYS_read\n        mov     rdi, r12\n        lea     rsi, [rdbuf]\n        mov     edx, 40\n        syscall\n        jc      .fail\n        mov     rdx, rax\n        lea     rsi, [rdbuf]\n        call    do_write\n        lea     rsi, [nl]\n        mov     edx, 1\n        call    do_write\n        mov     eax, SYS_close\n        mov     rdi, r12\n        syscall\n\n        ; 4. mmap(NULL, 4096, PROT_READ|PROT_WRITE, MAP_PRIVATE|MAP_ANON, -1, 0)\n        ;    macOS: MAP_PRIVATE = 0x2, MAP_ANON = 0x1000 (differs from Linux!)\n        mov     eax, SYS_mmap\n        xor     edi, edi\n        mov     esi, 4096\n        mov     edx, 3\n        mov     r10d, 0x1002\n        mov     r8, -1\n        xor     r9d, r9d\n        syscall\n        jc      .fail\n        mov     r13, rax\n        lea     rsi, [mapmsg]\n        mov     rdi, r13\n        mov     ecx, mapmsg_len\n        cld\n        rep movsb\n        mov     rsi, r13\n        mov     edx, mapmsg_len\n        call    do_write\n        mov     eax, SYS_munmap\n        mov     rdi, r13\n        mov     esi, 4096\n        syscall\n\n        ; 5. exit(0)\n        xor     edi, edi\n        mov     eax, SYS_exit\n        syscall\n.fail:\n        mov     edi, 1\n        mov     eax, SYS_exit\n        syscall\n"}, {"id": "Libc/macOS_x64/libc_calls.asm", "kind": "libc", "dir": "Libc", "folder": "macOS_x64", "os": "macOS", "arch": "x86-64", "file": "libc_calls.asm", "code": "; macOS x86-64: C standard library calls from assembly (System V ABI).\n; (Intel Macs, or Apple silicon through Rosetta.)\n; Build: make   Run: ./libc_calls\n; macOS differences from Linux: C symbols get a leading underscore (_puts), there is\n; no PLT syntax (plain \"call _puts\"), MAP_ANON is 0x1000, sections are Mach-O.\n; Convention: args RDI RSI RDX RCX R8 R9, result RAX; for variadic calls (printf)\n;             AL = number of vector registers used (0 here).\n;             RSP must be 16-byte aligned at every \"call\".\n;             Callee-saved: RBX RBP R12-R15.\n; Shows: 1. fopen/fwrite/fread/fclose   2. malloc/free\n;        3. fork + execv + waitpid (create a process)\n;        4. mmap an executable page, copy machine code into it and call it\ndefault rel\nextern _puts, _printf, _fopen, _fwrite, _fread, _fclose, _fflush\nextern _malloc, _free, _fork, _execv, _waitpid, __exit, _mmap, _munmap\n\nsection .data\npath:    db \"/tmp/libc_demo_mac.txt\", 0\nwmode:   db \"w\", 0\nrmode:   db \"r\", 0\ntext:    db \"written with fwrite\", 10\ntext_len equ $ - text\nh1:      db \"1. stdio: fopen/fwrite/fclose then fopen/fread/fclose\", 0\nf1:      db \"   read back %zu bytes: %s\", 0\nf2:      db \"2. malloc(64) returned %p, stored value %ld, now free()\", 10, 0\nh3:      db \"3. fork + execv(/bin/echo) + waitpid\", 0\nf3:      db \"   child %d finished with exit status %d\", 10, 0\nf4:      db \"4. executable page at %p: called generated code, it returned %d\", 10, 0\necho:    db \"/bin/echo\", 0\narg1:    db \"   hello from the child process\", 0\nargv:    dq echo, arg1, 0\n; machine code:  mov eax, 42 ; ret\ncode:    db 0xB8, 42, 0, 0, 0, 0xC3\ncode_len equ $ - code\n\nsection .bss\nbuf:     resb 64\nstatus:  resd 1\n\nsection .text\nglobal _main\n_main:\n        push    rbp\n        mov     rbp, rsp\n        push    rbx\n        push    r12                     ; two pushes + rbp = aligned again\n\n        ; 1. stdio\n        lea     rdi, [h1]\n        call    _puts\n        lea     rdi, [path]\n        lea     rsi, [wmode]\n        call    _fopen\n        test    rax, rax\n        jz      .fail\n        mov     rbx, rax                ; FILE*\n        lea     rdi, [text]             ; fwrite(ptr, size, count, stream)\n        mov     esi, 1\n        mov     edx, text_len\n        mov     rcx, rbx\n        call    _fwrite\n        mov     rdi, rbx\n        call    _fclose\n        lea     rdi, [path]\n        lea     rsi, [rmode]\n        call    _fopen\n        test    rax, rax\n        jz      .fail\n        mov     rbx, rax\n        lea     rdi, [buf]              ; fread(ptr, size, count, stream)\n        mov     esi, 1\n        mov     edx, 63\n        mov     rcx, rbx\n        call    _fread\n        mov     r12, rax                ; bytes read\n        lea     rdx, [buf]\n        mov     byte [rdx + rax], 0     ; (rip-relative addressing cannot take an index)\n        mov     rdi, rbx\n        call    _fclose\n        lea     rdi, [f1]\n        mov     rsi, r12\n        lea     rdx, [buf]\n        xor     eax, eax\n        call    _printf\n\n        ; 2. malloc / free\n        mov     edi, 64\n        call    _malloc\n        test    rax, rax\n        jz      .fail\n        mov     rbx, rax\n        mov     qword [rbx], 12345\n        lea     rdi, [f2]\n        mov     rsi, rbx\n        mov     rdx, [rbx]\n        xor     eax, eax\n        call    _printf\n        mov     rdi, rbx\n        call    _free\n\n        ; 3. fork / execv / waitpid\n        lea     rdi, [h3]\n        call    _puts\n        xor     edi, edi                ; fflush(NULL) flushes every stream, so the\n                                        ; child's copy of our buffer is empty\n        call    _fflush\n        call    _fork\n        test    eax, eax\n        js      .fail\n        jz      .child\n        mov     r12d, eax               ; child pid\n        mov     edi, eax\n        lea     rsi, [status]\n        xor     edx, edx\n        call    _waitpid\n        mov     eax, [status]\n        shr     eax, 8\n        and     eax, 0xFF               ; WEXITSTATUS\n        lea     rdi, [f3]\n        mov     esi, r12d\n        mov     edx, eax\n        xor     eax, eax\n        call    _printf\n        jmp     .exec_page\n.child:\n        lea     rdi, [echo]\n        lea     rsi, [argv]\n        call    _execv\n        mov     edi, 127                ; only reached if execv failed\n        call    __exit\n\n        ; 4. executable memory\n.exec_page:\n        xor     edi, edi\n        mov     esi, 4096\n        mov     edx, 7                  ; PROT_READ | PROT_WRITE | PROT_EXEC\n        mov     ecx, 0x1002             ; MAP_PRIVATE | MAP_ANON (macOS value)\n        mov     r8, -1\n        xor     r9d, r9d\n        call    _mmap\n        cmp     rax, -1\n        je      .fail\n        mov     rbx, rax\n        lea     rsi, [code]\n        mov     rdi, rbx\n        mov     ecx, code_len\n        cld\n        rep movsb\n        call    rbx                     ; run the generated code\n        mov     r12d, eax\n        lea     rdi, [f4]\n        mov     rsi, rbx\n        mov     edx, r12d\n        xor     eax, eax\n        call    _printf\n        mov     rdi, rbx\n        mov     esi, 4096\n        call    _munmap\n\n        xor     eax, eax\n        jmp     .done\n.fail:\n        mov     eax, 1\n.done:\n        pop     r12\n        pop     rbx\n        pop     rbp\n        ret\n"}, {"id": "Windows_x64/syscalls_api.asm", "kind": "syscall", "dir": "Syscalls", "folder": "Windows_x64", "os": "Windows", "arch": "x86-64", "file": "syscalls_api.asm", "code": "; Windows x64: the SUPPORTED route - Win32 API calls into kernel32.dll (which in\n; turn call ntdll.dll, which finally executes the real \"syscall\" instruction).\n; Same five steps as the Linux/macOS examples.  Build + run: .\\quickBuild.ps1\n; Convention (Microsoft x64): args RCX, RDX, R8, R9, then the stack; the caller\n; always reserves 32 bytes of \"shadow space\"; RSP must be 16-byte aligned at a call.\ndefault rel\nextern GetStdHandle\nextern WriteFile\nextern GetCurrentProcessId\nextern CreateFileA\nextern ReadFile\nextern CloseHandle\nextern VirtualAlloc\nextern VirtualFree\nextern ExitProcess\n\nSTD_OUTPUT_HANDLE equ -11\nGENERIC_READ      equ 0x80000000\nFILE_SHARE_READ   equ 1\nOPEN_EXISTING     equ 3\nMEM_COMMIT_RESERVE equ 0x3000\nMEM_RELEASE       equ 0x8000\nPAGE_READWRITE    equ 4\n\nsection .data\nmsg:     db \"1. WriteFile: Hello from the Win32 API on x64\", 13, 10\nmsg_len  equ $ - msg\npidmsg:  db \"2. GetCurrentProcessId: \"\npidmsg_len equ $ - pidmsg\nfilemsg: db \"3. CreateFileA/ReadFile/CloseHandle hosts file (first 40 bytes):\", 13, 10\nfilemsg_len equ $ - filemsg\nmapmsg:  db \"4. VirtualAlloc: wrote this text into a fresh page\", 13, 10\nmapmsg_len equ $ - mapmsg\npath:    db \"C:\\Windows\\System32\\drivers\\etc\\hosts\", 0\ncrlf:    db 13, 10\n\nsection .bss\nhOut:    resq 1\nhFile:   resq 1\npage:    resq 1\ncount:   resd 1\nnumbuf:  resb 24\nrdbuf:   resb 40\n\nsection .text\nglobal start\n\n; write_buf: RSI = buffer, EDX = length.  WriteFile(hOut, buf, len, &count, NULL)\n; (RSI is only borrowed here; fine because nothing else in this program needs it.)\nwrite_buf:\n        sub     rsp, 0x28               ; shadow space + 5th arg slot, keeps alignment\n        mov     rcx, [hOut]\n        mov     r8d, edx\n        mov     rdx, rsi\n        lea     r9, [count]\n        mov     qword [rsp + 0x20], 0   ; lpOverlapped = NULL\n        call    WriteFile\n        add     rsp, 0x28\n        ret\n\n; print_dec: EAX = value, prints decimal + CRLF\nprint_dec:\n        lea     rsi, [numbuf + 20]\n        mov     word [rsi], 0x0A0D      ; CR LF\n        mov     ecx, 10\n.next:  xor     edx, edx\n        div     ecx\n        add     dl, '0'\n        dec     rsi\n        mov     [rsi], dl\n        test    eax, eax\n        jnz     .next\n        lea     rdx, [numbuf + 22]\n        sub     rdx, rsi\n        jmp     write_buf\n\nstart:\n        sub     rsp, 0x58               ; 0x20 shadow + 0x20 stack args + alignment\n\n        ; 1. GetStdHandle + WriteFile\n        mov     ecx, STD_OUTPUT_HANDLE\n        call    GetStdHandle\n        mov     [hOut], rax\n        lea     rsi, [msg]\n        mov     edx, msg_len\n        call    write_buf\n\n        ; 2. GetCurrentProcessId\n        lea     rsi, [pidmsg]\n        mov     edx, pidmsg_len\n        call    write_buf\n        call    GetCurrentProcessId\n        call    print_dec\n\n        ; 3. CreateFileA / ReadFile / CloseHandle\n        lea     rsi, [filemsg]\n        mov     edx, filemsg_len\n        call    write_buf\n        lea     rcx, [path]\n        mov     edx, GENERIC_READ\n        mov     r8d, FILE_SHARE_READ\n        xor     r9d, r9d                            ; no security attributes\n        mov     qword [rsp + 0x20], OPEN_EXISTING   ; dwCreationDisposition\n        mov     qword [rsp + 0x28], 0               ; dwFlagsAndAttributes\n        mov     qword [rsp + 0x30], 0               ; hTemplateFile\n        call    CreateFileA\n        cmp     rax, -1                             ; INVALID_HANDLE_VALUE\n        je      .fail\n        mov     [hFile], rax\n        mov     rcx, rax\n        lea     rdx, [rdbuf]\n        mov     r8d, 40\n        lea     r9, [count]\n        mov     qword [rsp + 0x20], 0\n        call    ReadFile\n        test    eax, eax\n        jz      .fail\n        lea     rsi, [rdbuf]\n        mov     edx, [count]\n        call    write_buf\n        lea     rsi, [crlf]\n        mov     edx, 2\n        call    write_buf\n        mov     rcx, [hFile]\n        call    CloseHandle\n\n        ; 4. VirtualAlloc / VirtualFree\n        xor     ecx, ecx\n        mov     edx, 4096\n        mov     r8d, MEM_COMMIT_RESERVE\n        mov     r9d, PAGE_READWRITE\n        call    VirtualAlloc\n        test    rax, rax\n        jz      .fail\n        mov     [page], rax\n        mov     rdi, rax\n        lea     rsi, [mapmsg]\n        mov     ecx, mapmsg_len\n        cld\n        rep movsb\n        mov     rsi, [page]\n        mov     edx, mapmsg_len\n        call    write_buf\n        mov     rcx, [page]\n        xor     edx, edx                ; size must be 0 with MEM_RELEASE\n        mov     r8d, MEM_RELEASE\n        call    VirtualFree\n\n        ; 5. ExitProcess(0)\n        xor     ecx, ecx\n        call    ExitProcess\n.fail:\n        mov     ecx, 1\n        call    ExitProcess\n"}, {"id": "Windows_x64/syscalls_raw.asm", "kind": "syscall", "dir": "Syscalls", "folder": "Windows_x64", "os": "Windows", "arch": "x86-64", "file": "syscalls_raw.asm", "code": "; Windows x64: RAW system calls - executing the \"syscall\" instruction ourselves.\n;\n; !! Windows system call numbers (SSNs) change between Windows versions and even\n; !! between builds, and Microsoft does not document them.  Never hard-code them.\n; !! This example finds the number at run time by reading it out of the\n; !! ntdll.dll stub, which on x64 always looks like:\n; !!       4C 8B D1          mov  r10, rcx\n; !!       B8 xx xx 00 00    mov  eax, <SSN>\n; !!       0F 05             syscall\n; !!       C3                ret\n; !! If security software has hooked the stub, the pattern check fails and we\n; !! stop with a message instead of guessing.\n;\n; Convention: SSN in EAX, args as for a normal Win64 call (RCX, RDX, R8, R9, stack),\n;             but RCX must be copied to R10 first (the kernel clobbers RCX).\n;             Result is an NTSTATUS in EAX (0 = STATUS_SUCCESS).\n; Calls shown: NtWriteFile and NtTerminateProcess.  Others (NtOpenFile,\n; NtReadFile, NtAllocateVirtualMemory, NtClose ...) work exactly the same way.\n; Build + run: .\\quickBuild.ps1\ndefault rel\nextern GetModuleHandleA\nextern GetProcAddress\nextern GetStdHandle\nextern WriteFile\nextern ExitProcess\n\nsection .data\nntdll:   db \"ntdll.dll\", 0\nn_write: db \"NtWriteFile\", 0\nn_term:  db \"NtTerminateProcess\", 0\nmsg:     db \"Hello from a raw Windows x64 syscall (NtWriteFile)\", 13, 10\nmsg_len  equ $ - msg\nhookmsg: db \"ntdll stub does not look like a plain syscall stub (hooked?)\", 13, 10\nhookmsg_len equ $ - hookmsg\n\nsection .bss\nhOut:      resq 1\nssn_write: resd 1\nssn_term:  resd 1\niosb:      resq 2                       ; IO_STATUS_BLOCK {Status, Information}\ncount:     resd 1\n\nsection .text\nglobal start\n\n; do_syscall: EAX = SSN; arguments laid out exactly as for a normal Win64 call.\ndo_syscall:\n        mov     r10, rcx\n        syscall\n        ret\n\n; get_ssn: RCX = module handle, RDX = function name.  Returns EAX = SSN, or -1.\nget_ssn:\n        sub     rsp, 0x28\n        call    GetProcAddress          ; RCX/RDX already set up\n        add     rsp, 0x28\n        test    rax, rax\n        jz      .bad\n        cmp     dword [rax], 0xB8D18B4C ; 4C 8B D1 B8 = mov r10,rcx ; mov eax,imm32\n        jne     .bad\n        mov     eax, [rax + 4]          ; the syscall number\n        ret\n.bad:   mov     eax, -1\n        ret\n\nstart:\n        sub     rsp, 0x58\n\n        mov     ecx, -11                ; STD_OUTPUT_HANDLE (only used for the error path)\n        call    GetStdHandle\n        mov     [hOut], rax\n\n        lea     rcx, [ntdll]\n        call    GetModuleHandleA\n        mov     rbx, rax                ; ntdll base (RBX is callee-saved; we never return)\n\n        mov     rcx, rbx\n        lea     rdx, [n_write]\n        call    get_ssn\n        mov     [ssn_write], eax\n        mov     rcx, rbx\n        lea     rdx, [n_term]\n        call    get_ssn\n        mov     [ssn_term], eax\n        cmp     dword [ssn_write], -1\n        je      .hooked\n        cmp     dword [ssn_term], -1\n        je      .hooked\n\n        ; NtWriteFile(FileHandle, Event, ApcRoutine, ApcContext, IoStatusBlock,\n        ;             Buffer, Length, ByteOffset, Key)      -- 9 arguments\n        mov     rcx, [hOut]\n        xor     edx, edx                ; Event = NULL\n        xor     r8d, r8d                ; ApcRoutine = NULL\n        xor     r9d, r9d                ; ApcContext = NULL\n        lea     rax, [iosb]\n        mov     [rsp + 0x20], rax       ; 5th: IoStatusBlock\n        lea     rax, [msg]\n        mov     [rsp + 0x28], rax       ; 6th: Buffer\n        mov     qword [rsp + 0x30], msg_len ; 7th: Length\n        mov     qword [rsp + 0x38], 0   ; 8th: ByteOffset = NULL\n        mov     qword [rsp + 0x40], 0   ; 9th: Key = NULL\n        mov     eax, [ssn_write]\n        call    do_syscall\n\n        ; NtTerminateProcess(NtCurrentProcess() = -1, exit status 0)\n        mov     rcx, -1\n        xor     edx, edx\n        mov     eax, [ssn_term]\n        call    do_syscall\n        ; not reached\n.hooked:\n        mov     rcx, [hOut]\n        lea     rdx, [hookmsg]\n        mov     r8d, hookmsg_len\n        lea     r9, [count]\n        mov     qword [rsp + 0x20], 0\n        call    WriteFile\n        mov     ecx, 1\n        call    ExitProcess\n"}, {"id": "Libc/Windows_x64/libc_calls.asm", "kind": "libc", "dir": "Libc", "folder": "Windows_x64", "os": "Windows", "arch": "x86-64", "file": "libc_calls.asm", "code": "; Windows x64: C runtime (UCRT) calls from assembly, plus the Win32 process API.\n; Build + run: .\\quickBuild.ps1\n; Convention (Microsoft x64): args RCX RDX R8 R9 then the stack, result RAX; the caller\n;   reserves 32 bytes of shadow space; RSP 16-byte aligned at every call.\n;   Callee-saved: RBX RBP RDI RSI R12-R15.  printf-style calls use the same registers.\n; Shows: 1. fopen/fwrite/fread/fclose   2. malloc/free\n;        3. create a process: CreateProcessA + WaitForSingleObject + GetExitCodeProcess\n;           (Windows has no fork/exec; one call both creates and starts the child)\n;        4. VirtualAlloc executable memory, copy machine code into it and call it\ndefault rel\nextern puts, printf, fopen, fwrite, fread, fclose, fflush, malloc, free\nextern CreateProcessA, WaitForSingleObject, GetExitCodeProcess, CloseHandle\nextern VirtualAlloc, VirtualFree\n\nsection .data\npath:    db \"libc_demo_win.txt\", 0\nwmode:   db \"wb\", 0                     ; \"b\" = binary: no CR LF translation\nrmode:   db \"rb\", 0\ntext:    db \"written with fwrite\", 10\ntext_len equ $ - text\nh1:      db \"1. stdio: fopen/fwrite/fclose then fopen/fread/fclose\", 0\nf1:      db \"   read back %zu bytes: %s\", 0\nf2:      db \"2. malloc(64) returned %p, stored value %lld, now free()\", 10, 0\nh3:      db \"3. CreateProcessA(cmd.exe /c echo ...) + WaitForSingleObject\", 0\nf3:      db \"   child process %lu finished with exit code %lu\", 10, 0\nf4:      db \"4. executable page at %p: called generated code, it returned %d\", 10, 0\ncmdline: db \"cmd.exe /c echo    hello from the child process\", 0   ; must be writable\n; machine code:  mov eax, 42 ; ret\ncode:    db 0xB8, 42, 0, 0, 0, 0xC3\ncode_len equ $ - code\n\nsection .bss\nbuf:     resb 64\nsinfo:      resb 104                       ; STARTUPINFOA\npinfo:      resb 24                        ; PROCESS_INFORMATION\nexitcode: resd 1\n\nsection .text\nglobal main\nmain:\n        push    rbx\n        push    rbp\n        push    rsi\n        push    rdi\n        sub     rsp, 0x58               ; 0x20 shadow + 0x28 stack args + padding, aligned\n\n        ; 1. stdio\n        lea     rcx, [h1]\n        call    puts\n        lea     rcx, [path]\n        lea     rdx, [wmode]\n        call    fopen\n        test    rax, rax\n        jz      .fail\n        mov     rbx, rax                ; FILE*\n        lea     rcx, [text]             ; fwrite(ptr, size, count, stream)\n        mov     edx, 1\n        mov     r8d, text_len\n        mov     r9, rbx\n        call    fwrite\n        mov     rcx, rbx\n        call    fclose\n        lea     rcx, [path]\n        lea     rdx, [rmode]\n        call    fopen\n        test    rax, rax\n        jz      .fail\n        mov     rbx, rax\n        lea     rcx, [buf]              ; fread(ptr, size, count, stream)\n        mov     edx, 1\n        mov     r8d, 63\n        mov     r9, rbx\n        call    fread\n        mov     rsi, rax                ; bytes read\n        lea     rdx, [buf]\n        mov     byte [rdx + rsi], 0\n        mov     rcx, rbx\n        call    fclose\n        lea     rcx, [f1]\n        mov     rdx, rsi\n        lea     r8, [buf]\n        call    printf\n\n        ; 2. malloc / free\n        mov     ecx, 64\n        call    malloc\n        test    rax, rax\n        jz      .fail\n        mov     rbx, rax\n        mov     qword [rbx], 12345\n        lea     rcx, [f2]\n        mov     rdx, rbx\n        mov     r8, [rbx]\n        call    printf\n        mov     rcx, rbx\n        call    free\n\n        ; 3. CreateProcessA\n        lea     rcx, [h3]\n        call    puts\n        xor     ecx, ecx\n        call    fflush                  ; fflush(NULL): keep our output before the child's\n        lea     rdi, [sinfo]\n        mov     dword [rdi], 104        ; STARTUPINFOA.cb\n        xor     ecx, ecx                ; lpApplicationName = NULL\n        lea     rdx, [cmdline]          ; lpCommandLine\n        xor     r8d, r8d                ; process security attributes\n        xor     r9d, r9d                ; thread security attributes\n        mov     qword [rsp + 0x20], 0   ; bInheritHandles = FALSE\n        mov     qword [rsp + 0x28], 0   ; dwCreationFlags\n        mov     qword [rsp + 0x30], 0   ; lpEnvironment\n        mov     qword [rsp + 0x38], 0   ; lpCurrentDirectory\n        mov     [rsp + 0x40], rdi       ; lpStartupInfo\n        lea     rax, [pinfo]\n        mov     [rsp + 0x48], rax       ; lpProcessInformation\n        call    CreateProcessA\n        test    eax, eax\n        jz      .fail\n        mov     rcx, [pinfo]               ; hProcess\n        mov     edx, -1                 ; INFINITE\n        call    WaitForSingleObject\n        mov     rcx, [pinfo]\n        lea     rdx, [exitcode]\n        call    GetExitCodeProcess\n        lea     rcx, [f3]\n        mov     edx, [pinfo + 16]          ; dwProcessId\n        mov     r8d, [exitcode]\n        call    printf\n        mov     rcx, [pinfo]\n        call    CloseHandle\n        mov     rcx, [pinfo + 8]\n        call    CloseHandle\n\n        ; 4. executable memory\n        xor     ecx, ecx\n        mov     edx, 4096\n        mov     r8d, 0x3000             ; MEM_COMMIT | MEM_RESERVE\n        mov     r9d, 0x40               ; PAGE_EXECUTE_READWRITE\n        call    VirtualAlloc\n        test    rax, rax\n        jz      .fail\n        mov     rbx, rax\n        mov     rdi, rbx\n        lea     rsi, [code]\n        mov     ecx, code_len\n        cld\n        rep movsb\n        call    rbx                     ; run the generated code\n        lea     rcx, [f4]\n        mov     rdx, rbx\n        mov     r8d, eax\n        call    printf\n        mov     rcx, rbx\n        xor     edx, edx\n        mov     r8d, 0x8000             ; MEM_RELEASE\n        call    VirtualFree\n\n        xor     eax, eax\n        jmp     .done\n.fail:\n        mov     eax, 1\n.done:\n        add     rsp, 0x58\n        pop     rdi\n        pop     rsi\n        pop     rbp\n        pop     rbx\n        ret\n"}, {"id": "Windows_ARM64/syscalls_api.asm", "kind": "syscall", "dir": "Syscalls", "folder": "Windows_ARM64", "os": "Windows", "arch": "ARM64", "file": "syscalls_api.asm", "code": "; Windows ARM64 (armasm64): the SUPPORTED route - Win32 API calls into kernel32.dll\n; (which call ntdll.dll, which finally executes the real \"svc\" instruction).\n; Same five steps as the Linux/macOS examples.  Build + run: .\\quickBuild.ps1\n; Convention (ARM64 Windows): args X0..X7, then the stack; result in X0;\n;   X19-X28 are preserved across calls; X18 is reserved by Windows (never touch it).\n; Strings are zero-terminated and printed with write_z (it finds the length itself).\n    AREA    |.text|, CODE, READONLY, ALIGN=4\n    EXPORT  start\n    IMPORT  GetStdHandle\n    IMPORT  WriteFile\n    IMPORT  GetCurrentProcessId\n    IMPORT  CreateFileA\n
