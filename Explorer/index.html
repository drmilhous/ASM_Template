IMPORT  ReadFile\n    IMPORT  CloseHandle\n    IMPORT  VirtualAlloc\n    IMPORT  VirtualFree\n    IMPORT  ExitProcess\n\n; write_buf: x1 = buffer, x2 = length.   WriteFile(hOut, buf, len, &count, NULL)\nwrite_buf PROC\n    stp     fp, lr, [sp, #-16]!\n    mov     fp, sp\n    adrp    x0, hOut\n    add     x0, x0, hOut\n    ldr     x0, [x0]\n    adrp    x3, count\n    add     x3, x3, count\n    mov     x4, #0\n    bl      WriteFile\n    ldp     fp, lr, [sp], #16\n    ret\n    ENDP\n\n; write_z: x0 = address of a zero-terminated string\nwrite_z PROC\n    stp     fp, lr, [sp, #-16]!\n    mov     fp, sp\n    mov     x1, x0\n    mov     x2, #0\nwz_len\n    ldrb    w3, [x1, x2]\n    cbz     w3, wz_go\n    add     x2, x2, #1\n    b       wz_len\nwz_go\n    bl      write_buf\n    ldp     fp, lr, [sp], #16\n    ret\n    ENDP\n\n; print_dec: x0 = value; prints it in decimal followed by CR LF\nprint_dec PROC\n    stp     fp, lr, [sp, #-16]!\n    mov     fp, sp\n    adrp    x1, numbuf\n    add     x1, x1, numbuf\n    mov     w3, #0\n    strb    w3, [x1, #22]               ; terminator\n    mov     w3, #13\n    strb    w3, [x1, #20]               ; CR\n    mov     w3, #10\n    strb    w3, [x1, #21]               ; LF\n    add     x1, x1, #20\n    mov     x5, #10\npd_loop\n    udiv    x6, x0, x5\n    msub    x7, x6, x5, x0              ; remainder\n    add     w7, w7, #48                 ; '0'\n    sub     x1, x1, #1\n    strb    w7, [x1]\n    mov     x0, x6\n    cbnz    x0, pd_loop\n    mov     x0, x1\n    bl      write_z\n    ldp     fp, lr, [sp], #16\n    ret\n    ENDP\n\nstart PROC\n    stp     fp, lr, [sp, #-16]!\n    mov     fp, sp\n\n    ; 1. GetStdHandle(STD_OUTPUT_HANDLE = -11) + WriteFile\n    movn    w0, #10                     ; w0 = -11\n    bl      GetStdHandle\n    adrp    x1, hOut\n    add     x1, x1, hOut\n    str     x0, [x1]\n    adrp    x0, msg\n    add     x0, x0, msg\n    bl      write_z\n\n    ; 2. GetCurrentProcessId\n    adrp    x0, pidmsg\n    add     x0, x0, pidmsg\n    bl      write_z\n    bl      GetCurrentProcessId\n    bl      print_dec\n\n    ; 3. CreateFileA / ReadFile / CloseHandle\n    adrp    x0, filemsg\n    add     x0, x0, filemsg\n    bl      write_z\n    adrp    x0, path\n    add     x0, x0, path\n    movz    w1, #0x8000, lsl #16        ; GENERIC_READ\n    mov     w2, #1                      ; FILE_SHARE_READ\n    mov     x3, #0                      ; no security attributes\n    mov     w4, #3                      ; OPEN_EXISTING\n    mov     w5, #0                      ; flags and attributes\n    mov     x6, #0                      ; no template file\n    bl      CreateFileA\n    cmn     x0, #1                      ; INVALID_HANDLE_VALUE (-1)?\n    beq     fail\n    mov     x19, x0                     ; file handle (X19 survives calls)\n    adrp    x1, rdbuf\n    add     x1, x1, rdbuf\n    mov     w2, #40\n    adrp    x3, count\n    add     x3, x3, count\n    mov     x4, #0\n    bl      ReadFile\n    cbz     w0, fail\n    adrp    x2, count\n    add     x2, x2, count\n    ldr     w2, [x2]                    ; bytes actually read\n    adrp    x1, rdbuf\n    add     x1, x1, rdbuf\n    bl      write_buf\n    adrp    x0, crlf\n    add     x0, x0, crlf\n    bl      write_z\n    mov     x0, x19\n    bl      CloseHandle\n\n    ; 4. VirtualAlloc / VirtualFree\n    mov     x0, #0\n    mov     w1, #4096\n    mov     w2, #0x3000                 ; MEM_COMMIT | MEM_RESERVE\n    mov     w3, #4                      ; PAGE_READWRITE\n    bl      VirtualAlloc\n    cbz     x0, fail\n    mov     x20, x0                     ; page address\n    adrp    x1, mapmsg\n    add     x1, x1, mapmsg\n    mov     x3, x20\ncp_loop\n    ldrb    w4, [x1], #1                ; copy the text (and its zero) into the page\n    strb    w4, [x3], #1\n    cbnz    w4, cp_loop\n    mov     x0, x20\n    bl      write_z\n    mov     x0, x20\n    mov     x1, #0                      ; size must be 0 with MEM_RELEASE\n    movz    w2, #0x8000                 ; MEM_RELEASE\n    bl      VirtualFree\n\n    ; 5. ExitProcess(0)\n    mov     w0, #0\n    bl      ExitProcess\nfail\n    mov     w0, #1\n    bl      ExitProcess\n    ENDP\n\n    AREA    |.rdata|, DATA, READONLY\nmsg     DCB     \"1. WriteFile: Hello from the Win32 API on ARM64\", 13, 10, 0\npidmsg  DCB     \"2. GetCurrentProcessId: \", 0\nfilemsg DCB     \"3. CreateFileA/ReadFile/CloseHandle hosts file (first 40 bytes):\", 13, 10, 0\nmapmsg  DCB     \"4. VirtualAlloc: wrote this text into a fresh page\", 13, 10, 0\npath    DCB     \"C:\\Windows\\System32\\drivers\\etc\\hosts\", 0\ncrlf    DCB     13, 10, 0\n\n    AREA    |.data|, DATA, READWRITE, ALIGN=3\nhOut    DCQ     0\ncount   DCD     0\nnumbuf  SPACE   24\nrdbuf   SPACE   41\n\n    END\n"}, {"id": "Windows_ARM64/syscalls_raw.asm", "kind": "syscall", "dir": "Syscalls", "folder": "Windows_ARM64", "os": "Windows", "arch": "ARM64", "file": "syscalls_raw.asm", "code": "; Windows ARM64 (armasm64): looking at the REAL system call.\n;\n; !! On Windows ARM64 the system call number is the immediate of the SVC instruction\n; !! itself:  \"svc #N\".  It cannot be put in a register, so unlike x64 you cannot\n; !! write one generic \"do_syscall\" helper; every call needs its own svc.  N changes\n; !! between Windows versions and builds and is undocumented, so never hard-code it.\n; !! The reliable way to make a raw call is the tiny stub ntdll.dll exports for each\n; !! call.  Each stub is just:\n; !!       svc  #N\n; !!       ret\n;\n; This program (1) finds NtWriteFile in ntdll, (2) decodes the SVC instruction to show\n; N on THIS machine, (3) calls the stub to write a message (that call IS the syscall),\n; (4) ends the process with NtTerminateProcess, again via its stub.\n; Other calls (NtOpenFile, NtReadFile, NtAllocateVirtualMemory, NtClose ...) work the same.\n; Build + run: .\\quickBuild.ps1\n    AREA    |.text|, CODE, READONLY, ALIGN=4\n    EXPORT  start\n    IMPORT  GetModuleHandleA\n    IMPORT  GetProcAddress\n    IMPORT  GetStdHandle\n    IMPORT  WriteFile\n    IMPORT  ExitProcess\n\nwrite_buf PROC                          ; x1 = buffer, x2 = length (via kernel32 WriteFile)\n    stp     fp, lr, [sp, #-16]!\n    mov     fp, sp\n    adrp    x0, hOut\n    add     x0, x0, hOut\n    ldr     x0, [x0]\n    adrp    x3, count\n    add     x3, x3, count\n    mov     x4, #0\n    bl      WriteFile\n    ldp     fp, lr, [sp], #16\n    ret\n    ENDP\n\nwrite_z PROC                            ; x0 = zero-terminated string\n    stp     fp, lr, [sp, #-16]!\n    mov     fp, sp\n    mov     x1, x0\n    mov     x2, #0\nwz_len\n    ldrb    w3, [x1, x2]\n    cbz     w3, wz_go\n    add     x2, x2, #1\n    b       wz_len\nwz_go\n    bl      write_buf\n    ldp     fp, lr, [sp], #16\n    ret\n    ENDP\n\nprint_dec PROC                          ; x0 = value; prints decimal + CR LF\n    stp     fp, lr, [sp, #-16]!\n    mov     fp, sp\n    adrp    x1, numbuf\n    add     x1, x1, numbuf\n    mov     w3, #0\n    strb    w3, [x1, #22]\n    mov     w3, #13\n    strb    w3, [x1, #20]\n    mov     w3, #10\n    strb    w3, [x1, #21]\n    add     x1, x1, #20\n    mov     x5, #10\npd_loop\n    udiv    x6, x0, x5\n    msub    x7, x6, x5, x0\n    add     w7, w7, #48\n    sub     x1, x1, #1\n    strb    w7, [x1]\n    mov     x0, x6\n    cbnz    x0, pd_loop\n    mov     x0, x1\n    bl      write_z\n    ldp     fp, lr, [sp], #16\n    ret\n    ENDP\n\n; get_stub: x0 = module handle, x1 = function name.  Returns x0 = address of the stub.\nget_stub PROC\n    stp     fp, lr, [sp, #-16]!\n    mov     fp, sp\n    bl      GetProcAddress\n    ldp     fp, lr, [sp], #16\n    ret\n    ENDP\n\nstart PROC\n    stp     fp, lr, [sp, #-16]!\n    mov     fp, sp\n\n    movn    w0, #10                     ; STD_OUTPUT_HANDLE (-11)\n    bl      GetStdHandle\n    adrp    x1, hOut\n    add     x1, x1, hOut\n    str     x0, [x1]\n\n    adrp    x0, ntdll\n    add     x0, x0, ntdll\n    bl      GetModuleHandleA\n    mov     x19, x0                     ; ntdll base\n\n    mov     x0, x19\n    adrp    x1, n_write\n    add     x1, x1, n_write\n    bl      get_stub\n    mov     x20, x0                     ; NtWriteFile stub\n    cbz     x20, nostub\n\n    ; Decode \"svc #N\":  encoding is 0xD4000001 | (N << 5)\n    ldr     w21, [x20]\n    movz    w22, #0xFFE0, lsl #16\n    movk    w22, #0x001F                ; mask 0xFFE0001F\n    and     w23, w21, w22\n    movz    w24, #0xD400, lsl #16\n    movk    w24, #0x0001                ; 0xD4000001\n    cmp     w23, w24\n    bne     nostub\n    ubfx    w21, w21, #5, #16           ; N\n    adrp    x0, ssnmsg\n    add     x0, x0, ssnmsg\n    bl      write_z\n    mov     x0, x21\n    bl      print_dec\n\n    mov     x0, x19\n    adrp    x1, n_term\n    add     x1, x1, n_term\n    bl      get_stub\n    mov     x22, x0                     ; NtTerminateProcess stub\n    cbz     x22, nostub\n\n    ; NtWriteFile(FileHandle, Event, ApcRoutine, ApcContext, IoStatusBlock,\n    ;             Buffer, Length, ByteOffset, Key)  - 9 args: x0..x7, 9th on the stack\n    sub     sp, sp, #16\n    str     xzr, [sp]                   ; 9th: Key = NULL\n    adrp    x0, hOut\n    add     x0, x0, hOut\n    ldr     x0, [x0]                    ; FileHandle\n    mov     x1, #0                      ; Event\n    mov     x2, #0                      ; ApcRoutine\n    mov     x3, #0                      ; ApcContext\n    adrp    x4, iosb\n    add     x4, x4, iosb                ; IoStatusBlock\n    adrp    x5, msg\n    add     x5, x5, msg                 ; Buffer\n    mov     x6, #54                     ; Length of msg below (incl. CR LF)\n    mov     x7, #0                      ; ByteOffset = NULL\n    blr     x20                         ; the stub runs \"svc #N\" for us\n    add     sp, sp, #16\n\n    ; NtTerminateProcess(NtCurrentProcess() = -1, status 0)\n    mov     x0, #-1\n    mov     x1, #0\n    blr     x22\n    ; not reached\nnostub\n    adrp    x0, hookmsg\n    add     x0, x0, hookmsg\n    bl      write_z\n    mov     w0, #1\n    bl      ExitProcess\n    ENDP\n\n    AREA    |.rdata|, DATA, READONLY\nntdll   DCB     \"ntdll.dll\", 0\nn_write DCB     \"NtWriteFile\", 0\nn_term  DCB     \"NtTerminateProcess\", 0\nssnmsg  DCB     \"NtWriteFile is system call number (the immediate of its svc): \", 0\nmsg     DCB     \"Hello from a raw Windows ARM64 syscall (NtWriteFile)\", 13, 10\nhookmsg DCB     \"ntdll stub does not start with svc (hooked or changed layout?)\", 13, 10, 0\n\n    AREA    |.data|, DATA, READWRITE, ALIGN=3\nhOut    DCQ     0\niosb    SPACE   16\ncount   DCD     0\nnumbuf  SPACE   24\n\n    END\n"}, {"id": "Libc/Windows_ARM64/libc_calls.asm", "kind": "libc", "dir": "Libc", "folder": "Windows_ARM64", "os": "Windows", "arch": "ARM64", "file": "libc_calls.asm", "code": "; Windows ARM64 (armasm64): C runtime (UCRT) calls from assembly, plus the Win32 process API.\n; Build + run: .\\quickBuild.ps1\n; Convention (ARM64 Windows): args X0..X7 then the stack, result X0, SP 16-byte aligned,\n;   X19-X28 preserved, X18 reserved (never use it).  Variadic calls (printf) pass their\n;   extra arguments in X1..X7 exactly like normal arguments.\n; Shows: 1. fopen/fwrite/fread/fclose   2. malloc/free\n;        3. create a process: CreateProcessA + WaitForSingleObject + GetExitCodeProcess\n;           (Windows has no fork/exec; one call both creates and starts the child)\n;        4. VirtualAlloc executable memory, copy machine code into it and call it\n;           (FlushInstructionCache is required on ARM after writing code)\n    AREA    |.text|, CODE, READONLY, ALIGN=4\n    EXPORT  main\n    IMPORT  puts\n    IMPORT  printf\n    IMPORT  fopen\n    IMPORT  fwrite\n    IMPORT  fread\n    IMPORT  fclose\n    IMPORT  fflush\n    IMPORT  malloc\n    IMPORT  free\n    IMPORT  CreateProcessA\n    IMPORT  WaitForSingleObject\n    IMPORT  GetExitCodeProcess\n    IMPORT  CloseHandle\n    IMPORT  VirtualAlloc\n    IMPORT  VirtualFree\n    IMPORT  GetCurrentProcess\n    IMPORT  FlushInstructionCache\n\nmain PROC\n    stp     fp, lr, [sp, #-48]!\n    mov     fp, sp\n    stp     x19, x20, [sp, #16]\n    stp     x21, x22, [sp, #32]\n\n    ; 1. stdio\n    adrp    x0, h1\n    add     x0, x0, h1\n    bl      puts\n    adrp    x0, path\n    add     x0, x0, path\n    adrp    x1, wmode\n    add     x1, x1, wmode\n    bl      fopen\n    cbz     x0, fail\n    mov     x19, x0                     ; FILE*\n    mov     x3, x0                      ; fwrite(ptr, size, count, stream)\n    adrp    x0, text\n    add     x0, x0, text\n    mov     x1, #1\n    mov     x2, #20                     ; length of text\n    bl      fwrite\n    mov     x0, x19\n    bl      fclose\n    adrp    x0, path\n    add     x0, x0, path\n    adrp    x1, rmode\n    add     x1, x1, rmode\n    bl      fopen\n    cbz     x0, fail\n    mov     x19, x0\n    mov     x3, x0                      ; fread(ptr, size, count, stream)\n    adrp    x0, buf\n    add     x0, x0, buf\n    mov     x1, #1\n    mov     x2, #63\n    bl      fread\n    mov     x20, x0                     ; bytes read\n    adrp    x1, buf\n    add     x1, x1, buf\n    strb    wzr, [x1, x20]              ; zero terminator\n    mov     x0, x19\n    bl      fclose\n    adrp    x0, f1\n    add     x0, x0, f1\n    mov     x1, x20\n    adrp    x2, buf\n    add     x2, x2, buf\n    bl      printf\n\n    ; 2. malloc / free\n    mov     x0, #64\n    bl      malloc\n    cbz     x0, fail\n    mov     x19, x0\n    mov     x1, #12345\n    str     x1, [x19]\n    adrp    x0, f2\n    add     x0, x0, f2\n    mov     x1, x19\n    ldr     x2, [x19]\n    bl      printf\n    mov     x0, x19\n    bl      free\n\n    ; 3. CreateProcessA\n    adrp    x0, h3\n    add     x0, x0, h3\n    bl      puts\n    mov     x0, #0\n    bl      fflush                      ; fflush(NULL): keep our output before the child's\n    adrp    x19, sinfo\n    add     x19, x19, sinfo\n    mov     w1, #104\n    str     w1, [x19]                   ; const esc = s => s.replace(/[&<>]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));

function fillArch() {
  const os = $('os').value, cur = $('arch').value;
  const archs = [...new Set(DATA.platforms.filter(p => !os || p.os === os).map(p => p.arch))];
